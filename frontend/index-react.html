<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speckit Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #f5f7fa;
        }

        #root {
            min-height: 100vh;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            animation: spin 1s linear infinite;
            margin-right: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1.2rem;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading">
            <div class="spinner"></div>
            Loading Dashboard...
        </div>
    </div>
    <script type="module">
        // Try to load React app from compiled source
        console.log('Loading dashboard...');
        
        // Import and render the React app
        import('./src/main.tsx').then(module => {
            console.log('✅ Dashboard loaded successfully');
        }).catch(err => {
            console.error('❌ Error loading dashboard:', err);
            document.getElementById('root').innerHTML = `
                <div class="error">
                    <div>
                        <h1>⚠️ Dashboard Error</h1>
                        <p>Unable to load React components. Please ensure:</p>
                        <ul style="text-align: left; max-width: 500px; margin: 20px auto;">
                            <li>✅ Backend API running on http://localhost:3000</li>
                            <li>✅ Frontend built with: npm run build</li>
                            <li>✅ Or use: npm run dev (for development)</li>
                            <li style="margin-top: 20px; color: #ffeb3b;">Try refreshing the page</li>
                        </ul>
                        <p style="margin-top: 20px; font-size: 0.9rem; color: #ccc;">${err.message}</p>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
