<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tests Covered Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 30%, #16213e 60%, #0f3460 100%);
            padding: 20px;
            color: #e0e0e0;
            min-height: 100vh;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tests-covered-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .tests-covered-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tests-covered-header h1 {
            background: linear-gradient(135deg, #00b4d8, #7c4dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 28px;
        }

        .sprint-selector {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .sprint-selector label {
            font-weight: 600;
            color: #8899aa;
        }

        .sprint-selector select {
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            transition: all 0.3s;
        }

        .sprint-selector select:hover {
            border-color: #00b4d8;
        }

        .sprint-selector select option {
            background: #1a1a2e;
            color: #e0e0e0;
        }

        .tests-covered-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            animation: fadeInUp 0.5s ease backwards;
        }

        .summary-card:nth-child(1) { animation-delay: 0.05s; }
        .summary-card:nth-child(2) { animation-delay: 0.1s; }
        .summary-card:nth-child(3) { animation-delay: 0.15s; }
        .summary-card:nth-child(4) { animation-delay: 0.2s; }

        .summary-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .summary-card.highlight {
            background: linear-gradient(135deg, #00b4d8 0%, #7c4dff 100%);
            color: white;
            border: none;
            box-shadow: 0 8px 30px rgba(0, 180, 216, 0.3);
        }

        .card-label {
            font-size: 12px;
            font-weight: 600;
            color: #8899aa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .summary-card.highlight .card-label {
            color: rgba(255, 255, 255, 0.9);
        }

        .card-value {
            font-size: 32px;
            font-weight: bold;
            color: #e0e0e0;
            margin-bottom: 10px;
        }

        .summary-card.highlight .card-value {
            color: white;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .summary-card.highlight .progress-bar {
            background: rgba(255, 255, 255, 0.2);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00e676, #00b4d8, #7c4dff);
            transition: width 0.3s ease;
        }

        .summary-card.highlight .progress-fill {
            background: white;
        }

        .tests-covered-content {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
        }

        .tests-covered-content h2 {
            margin: 0 0 20px 0;
            color: #e0e0e0;
        }

        .teams-table {
            width: 100%;
            border-collapse: collapse;
        }

        .teams-table thead {
            background: rgba(0, 180, 216, 0.1);
        }

        .teams-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #8899aa;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            font-size: 13px;
            text-transform: uppercase;
        }

        .teams-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #c0c0c0;
        }

        .teams-table tbody tr:hover {
            background: rgba(0, 180, 216, 0.05);
        }

        .team-name {
            font-weight: 600;
            color: #00b4d8;
        }

        .numeric {
            text-align: center;
            font-weight: 500;
        }

        .mini-progress {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .mini-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00e676, #00b4d8);
        }

        .loading, .error, .no-data {
            text-align: center;
            padding: 40px;
            font-size: 16px;
            color: #8899aa;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .error {
            color: #ff6b6b;
            background: rgba(255, 82, 82, 0.08);
            border: 1px solid rgba(255, 82, 82, 0.2);
        }

        .loading {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @media (max-width: 768px) {
            .tests-covered-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .tests-covered-summary {
                grid-template-columns: 1fr;
            }

            .teams-table {
                font-size: 14px;
            }

            .teams-table th, .teams-table td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const API_URL = 'http://localhost:3000/api/metrics/tests-covered';

        async function loadTestsCovered() {
            try {
                const app = document.getElementById('app');
                
                // Get available sprints
                const response = await fetch(API_URL);
                const result = await response.json();
                const allData = result.data || {};
                const sprints = result.available_sprints || Object.keys(allData).filter(k => k !== '_updated');

                if (sprints.length === 0) {
                    app.innerHTML = '<div class="no-data">No sprint data available</div>';
                    return;
                }

                // Use first sprint as default
                const selectedSprint = sprints[0];
                renderDashboard(allData, sprints, selectedSprint);

                // Attach event listener for sprint selector
                const selector = document.getElementById('sprintSelector');
                if (selector) {
                    selector.addEventListener('change', (e) => {
                        renderDashboard(allData, sprints, e.target.value);
                    });
                }
            } catch (error) {
                console.error('Error loading tests covered:', error);
                document.getElementById('app').innerHTML = `<div class="error">Error loading data: ${error.message}</div>`;
            }
        }

        function renderDashboard(allData, sprints, selectedSprint) {
            const sprintData = allData[selectedSprint] || {};
            const app = document.getElementById('app');
            const summary = sprintData.summary || {};
            const teamsObj = sprintData.teams || {};

            const totalTests = summary.total_test_cases || 0;
            const automatedTests = summary.total_automated || 0;
            const manualTests = totalTests - automatedTests;
            const coverage = totalTests > 0 ? Math.round((automatedTests / totalTests) * 100) : 0;
            // Convert teams object to array for rendering
            const teams = Object.entries(teamsObj).map(([name, stats]) => ({
                name: name,
                totalTests: stats.total_test_cases || 0,
                automatedTests: stats.automated_test_cases || 0,
                manualTests: (stats.total_test_cases || 0) - (stats.automated_test_cases || 0),
                coverage: stats.automation_coverage_percent || 0
            }));

            let html = `
                <div class="tests-covered-container">
                    <div class="tests-covered-header">
                        <h1>Tests Covered Dashboard</h1>
                        <div class="sprint-selector">
                            <label for="sprintSelector">Sprint:</label>
                            <select id="sprintSelector">
                                ${sprints.map(s => `<option value="${s}" ${s === selectedSprint ? 'selected' : ''}>${s}</option>`).join('')}
                            </select>
                        </div>
                    </div>

                    <div class="tests-covered-summary">
                        <div class="summary-card highlight">
                            <div class="card-label">Automation Coverage</div>
                            <div class="card-value">${coverage}%</div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${coverage}%"></div>
                            </div>
                        </div>
                        <div class="summary-card">
                            <div class="card-label">Total Tests</div>
                            <div class="card-value">${totalTests}</div>
                        </div>
                        <div class="summary-card">
                            <div class="card-label">Automated Tests</div>
                            <div class="card-value">${automatedTests}</div>
                        </div>
                        <div class="summary-card">
                            <div class="card-label">Manual Tests</div>
                            <div class="card-value">${manualTests}</div>
                        </div>
                    </div>

                    <div class="tests-covered-content">
                        <h2>Team Breakdown</h2>
                        ${teams.length > 0 ? `
                            <table class="teams-table">
                                <thead>
                                    <tr>
                                        <th>Team</th>
                                        <th class="numeric">Total Tests</th>
                                        <th class="numeric">Automated</th>
                                        <th class="numeric">Manual</th>
                                        <th class="numeric">Coverage</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${teams.map(team => {
                                        const teamCoverage = team.totalTests > 0 ? Math.round((team.automatedTests / team.totalTests) * 100) : 0;
                                        return `
                                            <tr>
                                                <td class="team-name">${team.name}</td>
                                                <td class="numeric">${team.totalTests}</td>
                                                <td class="numeric">${team.automatedTests}</td>
                                                <td class="numeric">${team.manualTests}</td>
                                                <td class="numeric">
                                                    ${teamCoverage}%
                                                    <div class="mini-progress">
                                                        <div class="mini-progress-fill" style="width: ${teamCoverage}%"></div>
                                                    </div>
                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        ` : '<div class="no-data">No team data available</div>'}
                    </div>
                </div>
            `;

            app.innerHTML = html;

            // Reattach event listener
            const selector = document.getElementById('sprintSelector');
            if (selector) {
                selector.removeEventListener('change', null);
                selector.addEventListener('change', (e) => {
                    renderDashboard(allData, sprints, e.target.value);
                });
            }
        }

        // Load on page load
        window.addEventListener('DOMContentLoaded', loadTestsCovered);
    </script>
</body>
</html>
