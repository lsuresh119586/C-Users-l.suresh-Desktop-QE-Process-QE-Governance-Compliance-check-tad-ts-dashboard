      // ── Defect Detail View ──
      async function loadDefectDetailView(defectType) {
        const container = document.getElementById('defectDetailContainer');
        if (!container) return;

        const titleMap = { openDefects: '🚨 Open Defects', closedDefects: '✓ Closed Defects', reopenedDefects: '↩️ Reopened Defects' };
        const title = titleMap[defectType] || 'Defects';
        const product = state.selectedProduct || 't360';
        const team = state.selectedTeam || '';

        container.innerHTML = `<div class="defect-detail-container"><div class="loading">Loading defect details...</div></div>`;

        try {
          // Extract sprint number (e.g., "vanguards-26.1.2" → "26.1.2")
          const sprintName = getSprintNumberFromState() || '26.1.5';

          const response = await fetch(`http://localhost:3000/api/defects/by-module?sprint=${encodeURIComponent(sprintName)}&product=${encodeURIComponent(product)}&team=${encodeURIComponent(team)}`);
          const data = await response.json();

          if (data.error) throw new Error(data.error);

          renderDefectDetail(container, data, defectType, title, product, team, sprintName);
        } catch (error) {
          console.error('Error loading defect details:', error);
          container.innerHTML = `<div class="defect-detail-container"><div class="error-message">Error loading defect data: ${error.message}</div></div>`;
        }
      }

      function getPriorityClass(priority) {
        const p = (priority || '').toLowerCase();
        if (p === 'critical' || p === 'highest' || p === 'blocker') return 'priority-critical';
        if (p === 'high') return 'priority-high';
        if (p === 'medium' || p === 'normal') return 'priority-medium';
        return 'priority-low';
      }

      function getPriorityLabel(priority) {
        const p = (priority || '').toLowerCase();
        if (p === 'critical') return 'Critical';
        if (p === 'highest') return 'Highest';
        if (p === 'blocker') return 'Blocker';
        if (p === 'high') return 'High';
        if (p === 'medium') return 'Medium';
        if (p === 'normal') return 'Normal';
        if (p === 'low' || p === 'lowest') return 'Low';
        if (p === 'undefined' || p === 'none' || !p) return 'Unset';
        return priority;
      }

      function getStatusClass(status) {
        const s = (status || '').toLowerCase();
        if (s === 'closed' || s === 'done' || s === 'resolved') return 'status-closed';
        if (s === 'in progress' || s === 'in-progress') return 'status-in-progress';
        if (s === 'to verify' || s === 'in review' || s === 'ready for test') return 'status-in-progress';
        if (s.includes('reopen')) return 'status-reopened';
        return 'status-open';
      }

      function getStatusLabel(status) {
        const s = (status || '').toLowerCase();
        if (s === 'closed' || s === 'done') return 'Closed';
        if (s === 'resolved') return 'Resolved';
        if (s === 'in progress' || s === 'in-progress') return 'In Progress';
        if (s === 'to verify') return 'To Verify';
        if (s === 'in review') return 'In Review';
        if (s === 'ready for test') return 'Ready for Test';
        if (s.includes('reopen')) return 'Reopened';
        return status || 'Open';
      }

      function renderDefectDetail(container, data, defectType, title, product, teamFilter, sprintName) {
        const teams = data.teams || {};
        const productLabel = product === 't360' ? 'T360' : product === 'dna' ? 'DnA' : product === 'passport' ? 'Passport' : (product || '').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        const jiraBaseUrl = 'https://jira.wolterskluwer.io/jira/browse/';

        // Filter teams by selected product
        const allowedTeams = productTeamMap[product] || [];
        const filteredTeams = {};
        for (const [teamName, teamData] of Object.entries(teams)) {
          // Match team names case-insensitively (API may capitalize differently)
          const matches = allowedTeams.length === 0 || allowedTeams.some(t => 
            teamName.toLowerCase().includes(t.toLowerCase()) || t.toLowerCase().includes(teamName.toLowerCase())
          );
          if (matches) filteredTeams[teamName] = teamData;
        }

        // Further filter by selected team if specified
        if (teamFilter) {
          const teamKeys = Object.keys(filteredTeams);
          for (const teamName of teamKeys) {
            if (!teamName.toLowerCase().includes(teamFilter.toLowerCase()) && !teamFilter.toLowerCase().includes(teamName.toLowerCase())) {
              delete filteredTeams[teamName];
            }
          }
        }

        // Collect bugs from filtered teams, filtering by defect type
        let allBugs = [];
        let totalOpen = 0, totalClosed = 0, totalReopened = 0;
        let criticalCount = 0, highCount = 0;

        for (const [teamName, teamData] of Object.entries(filteredTeams)) {
          const bugs = teamData.bugs || [];
          for (const bug of bugs) {
            const isOpen = bug.isOpen !== undefined ? bug.isOpen : !['closed', 'done', 'resolved'].includes((bug.status || '').toLowerCase());
            const isClosed = !isOpen;
            const isReopened = bug.reopened || (bug.reopenCount && bug.reopenCount > 0);

            if (isOpen) totalOpen++;
            if (isClosed) totalClosed++;
            if (isReopened) totalReopened++;

            const p = (bug.priority || '').toLowerCase();
            if (p === 'critical' || p === 'highest' || p === 'blocker') criticalCount++;
            if (p === 'high') highCount++;

            // Filter by defect type
            let include = false;
            if (defectType === 'openDefects' && isOpen) include = true;
            if (defectType === 'closedDefects' && isClosed) include = true;
            if (defectType === 'reopenedDefects' && isReopened) include = true;

            if (include) {
              allBugs.push({ ...bug, teamName });
            }
          }
        }

        // Build summary counts based on view type
        let viewCount = allBugs.length;
        let summaryCards = '';

        if (defectType === 'openDefects') {
          summaryCards = `
            <div class="defect-summary-card ds-open"><div class="ds-label">Open Bugs</div><div class="ds-value">${viewCount}</div></div>
            <div class="defect-summary-card ds-critical"><div class="ds-label">Critical/Highest</div><div class="ds-value">${allBugs.filter(b => ['critical','highest','blocker'].includes((b.priority||'').toLowerCase())).length}</div></div>
            <div class="defect-summary-card ds-high"><div class="ds-label">High</div><div class="ds-value">${allBugs.filter(b => (b.priority||'').toLowerCase() === 'high').length}</div></div>
            <div class="defect-summary-card"><div class="ds-label">Teams Affected</div><div class="ds-value">${new Set(allBugs.map(b => b.teamName)).size}</div></div>
          `;
        } else if (defectType === 'closedDefects') {
          summaryCards = `
            <div class="defect-summary-card ds-closed"><div class="ds-label">Closed Bugs</div><div class="ds-value">${viewCount}</div></div>
            <div class="defect-summary-card"><div class="ds-label">Total Open</div><div class="ds-value">${totalOpen}</div></div>
            <div class="defect-summary-card"><div class="ds-label">Close Rate</div><div class="ds-value">${(totalOpen + totalClosed) > 0 ? ((totalClosed / (totalOpen + totalClosed)) * 100).toFixed(1) : 0}%</div></div>
            <div class="defect-summary-card"><div class="ds-label">Teams</div><div class="ds-value">${new Set(allBugs.map(b => b.teamName)).size}</div></div>
          `;
        } else {
          summaryCards = `
            <div class="defect-summary-card ds-reopened"><div class="ds-label">Reopened Bugs</div><div class="ds-value">${viewCount}</div></div>
            <div class="defect-summary-card"><div class="ds-label">Total Bugs</div><div class="ds-value">${totalOpen + totalClosed}</div></div>
            <div class="defect-summary-card"><div class="ds-label">Reopen Rate</div><div class="ds-value">${(totalOpen + totalClosed) > 0 ? ((totalReopened / (totalOpen + totalClosed)) * 100).toFixed(1) : 0}%</div></div>
            <div class="defect-summary-card"><div class="ds-label">Teams</div><div class="ds-value">${new Set(allBugs.map(b => b.teamName)).size}</div></div>
          `;
        }

        // Group bugs by team
        const bugsByTeam = {};
        for (const bug of allBugs) {
          if (!bugsByTeam[bug.teamName]) bugsByTeam[bug.teamName] = [];
          bugsByTeam[bug.teamName].push(bug);
        }

        let teamsHtml = '';
        if (Object.keys(filteredTeams).length === 0 && product === 'collaboration-portal') {
          teamsHtml = `<div class="defect-no-data">Defect tracking for ${productLabel} is not yet integrated with Jira. Please check Jira directly for ${productLabel} defect data.</div>`;
        } else if (Object.keys(bugsByTeam).length === 0) {
          teamsHtml = `<div class="defect-no-data">No ${title.replace(/[^\w\s]/g, '').trim().toLowerCase()} found for ${productLabel} in Sprint ${sprintName}</div>`;
        } else {
          for (const [teamName, bugs] of Object.entries(bugsByTeam)) {
            teamsHtml += `
              <div class="defect-team-section">
                <h3>👥 ${teamName} (${bugs.length} ${bugs.length === 1 ? 'bug' : 'bugs'})</h3>
                <table class="defect-bugs-table">
                  <thead>
                    <tr>
                      <th>Key</th>
                      <th>Summary</th>
                      <th>Status</th>
                      <th>Priority</th>
                      ${defectType === 'reopenedDefects' ? '<th>Reopen Count</th>' : ''}
                      <th>Created</th>
                      <th>Updated</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${bugs.map(bug => `
                      <tr>
                        <td class="bug-key"><a href="${jiraBaseUrl}${bug.key}" target="_blank" rel="noopener">${bug.key}</a></td>
                        <td>${bug.summary || 'N/A'}</td>
                        <td><span class="defect-status-badge ${getStatusClass(bug.status)}">${getStatusLabel(bug.status)}</span></td>
                        <td><span class="defect-priority-badge ${getPriorityClass(bug.priority)}">${getPriorityLabel(bug.priority)}</span></td>
                        ${defectType === 'reopenedDefects' ? `<td style="text-align:center; font-weight:600; color:#ffab40;">${bug.reopenCount || 1}</td>` : ''}
                        <td>${bug.created ? new Date(bug.created).toLocaleDateString() : 'N/A'}</td>
                        <td>${bug.updated ? new Date(bug.updated).toLocaleDateString() : 'N/A'}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            `;
          }
        }

        container.innerHTML = `
          <div class="defect-detail-container">
            <div class="defect-detail-header">
              <h1>${title} — ${productLabel} — Sprint ${sprintName}</h1>
              <span style="color:#888; font-size:13px;">Source: ${data.source || 'Jira'}</span>
            </div>
            <div class="defect-summary-cards">${summaryCards}</div>
            ${teamsHtml}
          </div>
        `;
      }

      // Helper: extract sprint number from state.selectedSprint (e.g., "vanguards-26.1.2" → "26.1.2")
      function getSprintNumberFromState() {
        const sprintId = state.selectedSprint || '';
        const match = sprintId.match(/(\d+\.\d+\.\d+|\d+\.\d+\.IP)$/i);
        return match ? match[1] : '';
      }

      // Product-to-team mapping (team names as they appear in tests_covered data)
      const productTeamMap = {
        't360': ['Chargers', 'Chubb', 'Matrix', 'Mavericks', 'Nexus', 'Vanguards'],
        'dna': ['Minerva', 'Guardians', 'Athena'],
        'passport': ['PP Genesis', 'PP Pioneers', 'PP Spartacles', 'CPOD'],
        'collaboration-portal': []
      };

      async function loadTestsCoveredView() {
        const container = document.getElementById('testsCoveredContainer');
        if (!container) return;

        const selectedProduct = state.selectedProduct;

        try {
          // For Passport, use live qTest API instead of db.json
          if (selectedProduct === 'passport') {
            await loadPassportTestsCovered(container);
            return;
          }

          const response = await fetch('http://localhost:3000/api/metrics/tests-covered');
          const result = await response.json();
          // API returns { status, data: { "26.1.1": {...}, ... }, available_sprints: [...] }
          const allData = result.data || {};
          const sprints = (result.available_sprints || Object.keys(allData));
          // Sort sprints ascending (oldest first); IP sprints come last
          sprints.sort((a, b) => {
            if (a.includes('IP') && !b.includes('IP')) return 1;
            if (!a.includes('IP') && b.includes('IP')) return -1;
            const partsA = a.split('.').map(Number);
            const partsB = b.split('.').map(Number);
            for (let i = 0; i < Math.max(partsA.length, partsB.length); i++) {
              if ((partsA[i] || 0) !== (partsB[i] || 0)) return (partsA[i] || 0) - (partsB[i] || 0);
            }
            return 0;
          });

          if (sprints.length === 0) {
            container.innerHTML = '<div class="no-data">No sprint data available</div>';
            return;
          }

          // Auto-select the sprint matching the dashboard's current selection
          const dashboardSprintNum = getSprintNumberFromState();
          const selectedSprint = (dashboardSprintNum && sprints.includes(dashboardSprintNum)) ? dashboardSprintNum : sprints[0];
          renderTestsCoveredDashboard(allData, sprints, selectedSprint, selectedProduct);

          const selector = document.getElementById('testsCoveredSprintSelector');
          if (selector) {
            selector.addEventListener('change', (e) => {
              renderTestsCoveredDashboard(allData, sprints, e.target.value, selectedProduct);
            });
          }
        } catch (error) {
          console.error('Error loading tests covered:', error);
          container.innerHTML = `<div class="error-message">Error loading data: ${error.message}</div>`;
        }
      }

      // Load Passport Tests Covered from live qTest API
      async function loadPassportTestsCovered(container) {
        const sprints = ['26.1.1', '26.1.2', '26.1.3', '26.1.4', '26.1.5'];
        const dashboardSprintNum = getSprintNumberFromState();
        let selectedSprint = (dashboardSprintNum && sprints.includes(dashboardSprintNum)) ? dashboardSprintNum : sprints[sprints.length - 1];

        // Initial render with loading state
        container.innerHTML = '<div class="loading" style="text-align:center; padding:40px;">Loading Passport qTest data...</div>';

        async function fetchAndRender(sprint) {
          try {
            // Fetch live qTest data for Passport
            const qtestResp = await fetch(`http://localhost:3000/api/qtest/passport/sync-from-tadts/${sprint}`);
            const qtestData = await qtestResp.json();

            // Transform qTest data to match expected format
            const transformedData = {};
            transformedData[sprint] = {
              sprint: sprint,
              generated: qtestData.generated,
              source: qtestData.source,
              teams: {}
            };

            // Convert qTest team format to expected format
            const teams = qtestData.teams || {};
            for (const [teamName, teamData] of Object.entries(teams)) {
              transformedData[sprint].teams[teamName] = {
                total_test_cases: teamData.total || 0,
                automated_test_cases: teamData.automated || 0,
                automation_coverage_percent: teamData.total > 0 ? ((teamData.automated / teamData.total) * 100) : 0,
                with_attachments: teamData.with_attachments || 0,
                without_attachments: teamData.without_attachments || 0
              };
            }

            renderTestsCoveredDashboard(transformedData, sprints, sprint, 'passport');
          } catch (error) {
            console.error('Error fetching Passport qTest data:', error);
            container.innerHTML = `<div class="error-message">Error loading Passport qTest data: ${error.message}</div>`;
          }
        }

        await fetchAndRender(selectedSprint);

        // Add sprint selector listener
        setTimeout(() => {
          const selector = document.getElementById('testsCoveredSprintSelector');
          if (selector) {
            selector.addEventListener('change', (e) => {
              container.innerHTML = '<div class="loading" style="text-align:center; padding:40px;">Loading Passport qTest data...</div>';
              fetchAndRender(e.target.value);
            });
          }
        }, 100);
      }

      function renderTestsCoveredDashboard(allData, sprints, selectedSprint, selectedProduct) {
        const container = document.getElementById('testsCoveredContainer');
        const data = allData[selectedSprint] || {};

        // Convert teams object to array
        const teamsObj = data.teams || {};
        let teams = Object.entries(teamsObj).map(([name, stats]) => ({
          name,
          total: stats.total_test_cases || 0,
          automated: stats.automated_test_cases || 0,
          coverage: stats.automation_coverage_percent || 0,
          withAttachments: stats.with_attachments || 0
        }));

        // Filter teams by selected product
        if (selectedProduct) {
          const allowedTeams = (productTeamMap[selectedProduct] || []).map(t => t.toLowerCase());
          if (allowedTeams.length > 0) {
            teams = teams.filter(t => allowedTeams.includes(t.name.toLowerCase()));
          }
          // If product has no mapped teams or no matches, teams will be empty
        }

        // Recalculate summary from filtered teams
        const totalTests = teams.reduce((sum, t) => sum + t.total, 0);
        const automatedTests = teams.reduce((sum, t) => sum + t.automated, 0);
        const withAttachments = teams.reduce((sum, t) => sum + t.withAttachments, 0);
        const teamsCount = teams.length;
        const coverage = totalTests > 0 ? ((automatedTests / totalTests) * 100).toFixed(1) : 0;

        // Format product name for display
        const productLabel = selectedProduct 
          ? selectedProduct.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase())
          : 'All Products';

        let html = `
          <div class="tests-covered-container">
            <div class="tests-covered-header">
              <h1>🧪 Tests Covered — ${productLabel}</h1>
              <div class="sprint-selector">
                <label>Sprint: </label>
                <select id="testsCoveredSprintSelector">
                  ${sprints.map(s => `<option value="${s}" ${s === selectedSprint ? 'selected' : ''}>${s}</option>`).join('')}
                </select>
              </div>
            </div>

            ${teams.length === 0 ? `
              <div class="no-data" style="text-align:center; padding:40px; color:#999; font-size:1.1em;">
                No test coverage data available for <strong>${productLabel}</strong> in this sprint.
              </div>
            ` : `
            <div class="tests-covered-summary">
              <div class="summary-card">
                <div class="card-label">Total Test Cases</div>
                <div class="card-value">${totalTests}</div>
              </div>
              <div class="summary-card">
                <div class="card-label">Automated</div>
                <div class="card-value">${automatedTests}</div>
              </div>
              <div class="summary-card highlight">
                <div class="card-label">Automation Coverage</div>
                <div class="card-value">${coverage}%</div>
                <div class="tc-progress-bar">
                  <div class="tc-progress-fill" style="width: ${coverage}%"></div>
                </div>
              </div>
              <div class="summary-card">
                <div class="card-label">With Scripts</div>
                <div class="card-value">${withAttachments}</div>
              </div>
              <div class="summary-card">
                <div class="card-label">Teams</div>
                <div class="card-value">${teamsCount}</div>
              </div>
            </div>

            <div class="tests-covered-content">
              <h2>👥 Team Breakdown</h2>
              ${teams.length > 0 ? `
                <table class="tc-teams-table">
                  <thead>
                    <tr>
                      <th>Team</th>
                      <th class="tc-numeric">Total Tests</th>
                      <th class="tc-numeric">Automated</th>
                      <th class="tc-numeric">Coverage %</th>
                      <th>Progress</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${teams.map(team => {
                      const pct = team.coverage.toFixed ? team.coverage.toFixed(1) : team.coverage;
                      return `
                        <tr>
                          <td class="tc-team-name">${team.name}</td>
                          <td class="tc-numeric">${team.total}</td>
                          <td class="tc-numeric">${team.automated}</td>
                          <td class="tc-coverage-cell">${pct}%</td>
                          <td>
                            <div class="tc-mini-progress">
                              <div class="tc-mini-progress-fill" style="width: ${team.coverage}%"></div>
                            </div>
                          </td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              ` : '<div class="no-data">No team data available</div>'}
            </div>

            <div class="tests-covered-footer">
              <p>Generated: ${data.generated || 'N/A'}</p>
              <p>Sprint: ${data.sprint || selectedSprint}</p>
            </div>
            `}
          </div>
        `;

        container.innerHTML = html;

        const selector = document.getElementById('testsCoveredSprintSelector');
        if (selector) {
          selector.addEventListener('change', (e) => {
            renderTestsCoveredDashboard(allData, sprints, e.target.value, selectedProduct);
          });
        }
      }

      // ── DoR Compliance (TAD/TS) View ──
      // Track the currently selected product for DoR compliance
      let dorSelectedProduct = 't360';

      async function loadDorComplianceView() {
        const container = document.getElementById('dorComplianceContainer');
        if (!container) return;

        // Sync with the product selected on the main dashboard
        if (state.selectedProduct === 'passport' || state.selectedProduct === 't360') {
          dorSelectedProduct = state.selectedProduct;
        }

        container.innerHTML = `
          <div class="dor-compliance-container">
            <div class="dor-loading">
              <div class="dor-spinner"></div>
              <p>Loading available sprints...</p>
            </div>
          </div>
        `;

        await loadDorSprintsForProduct(container, dorSelectedProduct);
      }

      async function loadDorSprintsForProduct(container, product) {
        try {
          const sprintsUrl = product === 'passport'
            ? 'http://localhost:3000/api/tad-ts/passport/sprints'
            : 'http://localhost:3000/api/tad-ts/sprints';

          const resp = await fetch(sprintsUrl);
          const result = await resp.json();
          if (result.error) throw new Error(result.error);

          const sprintsRaw = result.sprints || [];
          if (sprintsRaw.length === 0) {
            container.innerHTML = '<div class="dor-compliance-container"><div class="no-data">No sprints available</div></div>';
            return;
          }

          // Normalize: sprints may be objects {id, name} or strings
          const sprints = sprintsRaw.map(s => typeof s === 'string' ? { id: s, name: s } : s);

          // Sort sprints ascending by id (IP sorts last)
          sprints.sort((a, b) => {
            if (a.id.includes('IP') && !b.id.includes('IP')) return 1;
            if (!a.id.includes('IP') && b.id.includes('IP')) return -1;
            const partsA = a.id.split('.').map(Number);
            const partsB = b.id.split('.').map(Number);
            for (let i = 0; i < Math.max(partsA.length, partsB.length); i++) {
              if ((partsA[i] || 0) !== (partsB[i] || 0)) return (partsA[i] || 0) - (partsB[i] || 0);
            }
            return 0;
          });

          renderDorSprintPicker(container, sprints, product);
        } catch (error) {
          console.error('Error loading DoR compliance sprints:', error);
          container.innerHTML = `<div class="dor-compliance-container"><div class="error-message">Error loading sprints: ${error.message}</div></div>`;
        }
      }

      function renderDorSprintPicker(container, sprints, product) {
        const productLabel = product === 'passport' ? 'Passport' : 'T360';
        const teamLabel = product === 'passport' ? 'Passport' : 'T360';

        container.innerHTML = `
          <div class="dor-compliance-container">
            <div class="dor-header">
              <h1>📋 TAD/TS Compliance Report</h1>
              <div class="dor-sprint-selector">
                <label>Product:</label>
                <select id="dorProductSelect" style="margin-right: 16px;">
                  <option value="t360" ${product === 't360' ? 'selected' : ''}>T360</option>
                  <option value="passport" ${product === 'passport' ? 'selected' : ''}>Passport</option>
                </select>
                <label>Sprint:</label>
                <select id="dorSprintSelect">
                  <option value="">-- Select Sprint --</option>
                  ${sprints.map(s => `<option value="${s.id}" ${s.id === getSprintNumberFromState() ? 'selected' : ''}>${s.name}</option>`).join('')}
                </select>
                <button id="dorLoadBtn" ${getSprintNumberFromState() && sprints.some(s => s.id === getSprintNumberFromState()) ? '' : 'disabled'}>Analyze Sprint</button>
              </div>
            </div>
            <div id="dorResultsContainer">
              <div class="no-data" style="padding: 60px;">Select a sprint and click <strong>Analyze Sprint</strong> to generate the TAD/TS compliance report.<br/><br/>
              This will query JIRA live for all <strong>${productLabel}</strong> team stories and bugs, checking:<br/>
              • <strong>TAD</strong> — Pull requests linked or technical design document in description<br/>
              • <strong>TS</strong> — Test strategy document linked in description<br/>
              • <strong>N/A</strong> — Comment indicating not applicable, or bug linked to parent story</div>
            </div>
          </div>
        `;

        // Product selector change handler
        const productSelect = document.getElementById('dorProductSelect');
        productSelect.addEventListener('change', async () => {
          dorSelectedProduct = productSelect.value;
          container.innerHTML = `
            <div class="dor-compliance-container">
              <div class="dor-loading">
                <div class="dor-spinner"></div>
                <p>Loading sprints for ${dorSelectedProduct === 'passport' ? 'Passport' : 'T360'}...</p>
              </div>
            </div>
          `;
          await loadDorSprintsForProduct(container, dorSelectedProduct);
        });

        const select = document.getElementById('dorSprintSelect');
        const btn = document.getElementById('dorLoadBtn');

        select.addEventListener('change', () => {
          btn.disabled = !select.value;
        });

        btn.addEventListener('click', async () => {
          const sprint = select.value;
          if (!sprint) return;

          const currentProduct = dorSelectedProduct;
          const currentProductLabel = currentProduct === 'passport' ? 'Passport' : 'T360';

          btn.disabled = true;
          btn.textContent = 'Analyzing...';
          const resultsContainer = document.getElementById('dorResultsContainer');
          resultsContainer.innerHTML = `
            <div class="dor-loading">
              <div class="dor-spinner"></div>
              <p>Analyzing sprint ${sprint} across all ${currentProductLabel} teams...<br/>This may take a minute.</p>
            </div>
          `;

          try {
            const apiUrl = currentProduct === 'passport'
              ? `http://localhost:3000/api/tad-ts/passport/sprint/${sprint}`
              : `http://localhost:3000/api/tad-ts/sprint/${sprint}`;

            const resp = await fetch(apiUrl);
            const result = await resp.json();
            if (result.error) throw new Error(result.error);

            // Check if the sprint has any data
            const totalIssues = result.data?.summary?.total || 0;
            if (totalIssues === 0) {
              resultsContainer.innerHTML = `
                <div class="no-data" style="padding: 60px; text-align: center;">
                  <h2 style="color: #ff9800; margin-bottom: 16px;">⚠️ No Issues Found</h2>
                  <p>Sprint <strong>${sprint}</strong> returned 0 Bug/Story issues from ${currentProductLabel} teams.</p>
                  <p style="margin-top: 12px; color: #8899aa;">This sprint may not exist in JIRA or may have no issues assigned to ${currentProductLabel} teams.<br/>Try selecting a different sprint.</p>
                </div>
              `;
              return;
            }

            renderDorComplianceResults(resultsContainer, result.data, sprint);
          } catch (error) {
            console.error('Error loading DoR compliance:', error);
            resultsContainer.innerHTML = `<div class="error-message">Error analyzing sprint: ${error.message}</div>`;
          } finally {
            btn.disabled = false;
            btn.textContent = 'Analyze Sprint';
          }
        });

        // Auto-trigger analysis if a sprint was pre-selected from dashboard
        if (select.value) {
          btn.click();
        }
      }

      function renderDorComplianceResults(container, data, sprintNumber) {
        const summary = data.summary || {};
        const teamsRaw = data.teams || {};

        // Flatten issues from all teams
        const issues = [];
        for (const [teamName, teamData] of Object.entries(teamsRaw)) {
          const teamIssues = teamData.issues || [];
          for (const issue of teamIssues) {
            issues.push({
              key: issue.key,
              type: issue.type,
              team: teamName,
              summary: issue.summary,
              status: issue.status,
              assignee: issue.assignee,
              tadStatus: issue.tadNA ? 'N/A' : (issue.tadFound ? 'Yes' : 'No'),
              tsStatus: issue.tsNA ? 'N/A' : (issue.tsFound ? 'Yes' : 'No'),
              hasPR: issue.totalPrs > 0,
              hasDescriptionLink: (issue.tadSource || '').toLowerCase() === 'description' || (issue.tsSource || '').toLowerCase() === 'description',
              isNA: issue.tadNA || issue.tsNA,
              linkedToStory: issue.type === 'Bug' && (issue.tadNA || issue.tsNA),
              tadSource: issue.tadSource,
              tsSource: issue.tsSource
            });
          }
        }

        const totalIssues = summary.total || 0;
        const tadCompliant = summary.tadComplete || 0;
        const tsCompliant = summary.tsComplete || 0;
        const bothCompliant = summary.bothComplete || 0;
        const tadNA = summary.tadNA || 0;
        const tsNA = summary.tsNA || 0;
        // Count unique N/A issues (issues where either TAD or TS is N/A)
        const naUniqueCount = issues.filter(i => i.tadStatus === 'N/A' || i.tsStatus === 'N/A').length;
        const tadApplicable = summary.tadApplicable || (totalIssues - tadNA);
        const tsApplicable = summary.tsApplicable || (totalIssues - tsNA);
        const missingTad = summary.missingTad || 0;
        const missingTs = summary.missingTs || 0;
        const tadPct = summary.tadPct || 0;
        const tsPct = summary.tsPct || 0;
        const bothPct = summary.bothPct || 0;

        function pctClass(pct) {
          const v = parseFloat(pct);
          if (v >= 80) return 'dor-pct-good';
          if (v >= 50) return 'dor-pct-warn';
          return 'dor-pct-bad';
        }

        // Build teams array from raw data
        const teams = Object.entries(teamsRaw).map(([name, stats]) => ({
          name,
          total: stats.total || 0,
          tad: stats.tadComplete || 0,
          ts: stats.tsComplete || 0,
          both: stats.bothComplete || 0,
          tadNA: stats.tadNA || 0,
          tsNA: stats.tsNA || 0,
          missingTad: stats.missingTad || 0,
          missingTs: stats.missingTs || 0,
          tadPct: (stats.tadPct || 0).toFixed(1),
          tsPct: (stats.tsPct || 0).toFixed(1),
        }));

        let html = `
          <!-- Summary Cards -->
          <div class="dor-summary-grid">
            <div class="dor-summary-card dor-highlight">
              <div class="dor-card-label">Total Issues</div>
              <div class="dor-card-value">${totalIssues}</div>
              <div style="font-size:12px; color:rgba(255,255,255,0.7); margin-top:4px;">Bug + Story</div>
            </div>
            <div class="dor-summary-card dor-tad">
              <div class="dor-card-label">TAD Compliant</div>
              <div class="dor-card-value">${tadCompliant}</div>
              <div class="dor-compliance-pct ${pctClass(tadPct)}">${tadPct}% <span style="font-size:11px; opacity:0.7;">of ${tadApplicable} applicable</span></div>
            </div>
            <div class="dor-summary-card dor-ts">
              <div class="dor-card-label">TS Compliant</div>
              <div class="dor-card-value">${tsCompliant}</div>
              <div class="dor-compliance-pct ${pctClass(tsPct)}">${tsPct}% <span style="font-size:11px; opacity:0.7;">of ${tsApplicable} applicable</span></div>
            </div>
            <div class="dor-summary-card dor-both">
              <div class="dor-card-label">Both TAD &amp; TS</div>
              <div class="dor-card-value">${bothCompliant}</div>
              <div class="dor-compliance-pct ${pctClass(bothPct)}">${bothPct}%</div>
            </div>
            <div class="dor-summary-card dor-na">
              <div class="dor-card-label">N/A (Exempt)</div>
              <div class="dor-card-value">${naUniqueCount}</div>
              <div style="font-size:11px; color:#8899aa; margin-top:4px;">TAD N/A: ${tadNA} | TS N/A: ${tsNA}</div>
            </div>
            <div class="dor-summary-card" style="border-left: 4px solid #ff5252;">
              <div class="dor-card-label">Truly Missing</div>
              <div class="dor-card-value" style="font-size:24px; color:#ff5252;">
                TAD: ${missingTad} | TS: ${missingTs}
              </div>
              <div style="font-size:11px; color:#8899aa; margin-top:4px;">Excluding N/A items</div>
            </div>
          </div>

          <!-- Team Breakdown -->
          ${teams.length > 0 ? `
          <div class="dor-team-section">
            <h2>👥 Team Breakdown</h2>
            <table class="dor-team-table">
              <thead>
                <tr>
                  <th>Team</th>
                  <th class="dor-numeric">Issues</th>
                  <th class="dor-numeric">TAD ✓</th>
                  <th class="dor-numeric">TS ✓</th>
                  <th class="dor-numeric">Both ✓</th>
                  <th class="dor-numeric">TAD N/A</th>
                  <th class="dor-numeric">TS N/A</th>
                  <th class="dor-numeric">Missing TAD</th>
                  <th class="dor-numeric">Missing TS</th>
                  <th class="dor-numeric">TAD %</th>
                  <th class="dor-numeric">TS %</th>
                </tr>
              </thead>
              <tbody>
                ${teams.map(t => `
                  <tr>
                    <td class="dor-team-name">${t.name}</td>
                    <td class="dor-numeric">${t.total}</td>
                    <td class="dor-numeric">${t.tad}</td>
                    <td class="dor-numeric">${t.ts}</td>
                    <td class="dor-numeric">${t.both}</td>
                    <td class="dor-numeric">${t.tadNA}</td>
                    <td class="dor-numeric">${t.tsNA}</td>
                    <td class="dor-numeric" style="color:${t.missingTad > 0 ? '#ff5252' : '#00e676'}">${t.missingTad}</td>
                    <td class="dor-numeric" style="color:${t.missingTs > 0 ? '#ff5252' : '#00e676'}">${t.missingTs}</td>
                    <td class="dor-numeric"><span class="${pctClass(t.tadPct)}">${t.tadPct}%</span></td>
                    <td class="dor-numeric"><span class="${pctClass(t.tsPct)}">${t.tsPct}%</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
          ` : ''}

          <!-- Issue Details -->
          <div class="dor-issues-section">
            <h2>📝 Issue Details (${issues.length})</h2>
            <div class="dor-filter-bar">
              <label>Filter:</label>
              <select id="dorTeamFilter">
                <option value="">All Teams</option>
                ${teams.map(t => `<option value="${t.name}">${t.name}</option>`).join('')}
              </select>
              <select id="dorTypeFilter">
                <option value="">All Types</option>
                <option value="Story">Stories</option>
                <option value="Bug">Bugs</option>
              </select>
              <select id="dorComplianceFilter">
                <option value="">All Status</option>
                <option value="compliant">TAD+TS Compliant</option>
                <option value="non-compliant">Non-Compliant</option>
                <option value="na">N/A</option>
              </select>
            </div>
            <div id="dorIssueTableContainer">
              ${renderDorIssueTable(issues)}
            </div>
          </div>

          <div class="tests-covered-footer">
            <p>Sprint: ${sprintNumber} | Generated: ${new Date().toLocaleString()}</p>
            <p>Data fetched live from JIRA | Teams: ${teams.map(t => t.name).join(', ')}</p>
          </div>
        `;

        container.innerHTML = html;

        // Attach filter handlers
        const teamFilter = document.getElementById('dorTeamFilter');
        const typeFilter = document.getElementById('dorTypeFilter');
        const complianceFilter = document.getElementById('dorComplianceFilter');

        function applyFilters() {
          const team = teamFilter.value;
          const type = typeFilter.value;
          const compliance = complianceFilter.value;

          let filtered = issues;
          if (team) filtered = filtered.filter(i => i.team === team);
          if (type) filtered = filtered.filter(i => i.type === type);
          if (compliance === 'compliant') filtered = filtered.filter(i => i.tadStatus === 'Yes' && i.tsStatus === 'Yes');
          if (compliance === 'non-compliant') filtered = filtered.filter(i => (i.tadStatus === 'No' || i.tsStatus === 'No') && i.tadStatus !== 'N/A' && i.tsStatus !== 'N/A');
          if (compliance === 'na') filtered = filtered.filter(i => i.tadStatus === 'N/A' || i.tsStatus === 'N/A');

          document.getElementById('dorIssueTableContainer').innerHTML = renderDorIssueTable(filtered);
        }

        teamFilter?.addEventListener('change', applyFilters);
        typeFilter?.addEventListener('change', applyFilters);
        complianceFilter?.addEventListener('change', applyFilters);
      }

      function renderDorIssueTable(issues) {
        if (issues.length === 0) return '<div class="no-data">No issues match the selected filters</div>';

        const jiraBase = 'https://jira.wolterskluwer.io/jira/browse/';

        return `
          <table class="dor-issue-table">
            <thead>
              <tr>
                <th>Key</th>
                <th>Type</th>
                <th>Team</th>
                <th>Summary</th>
                <th>Status</th>
                <th>TAD</th>
                <th>TS</th>
                <th>Details</th>
              </tr>
            </thead>
            <tbody>
              ${issues.map(issue => {
                const tadBadge = issue.tadStatus === 'Yes' ? 'dor-badge-yes' : issue.tadStatus === 'N/A' ? 'dor-badge-na' : 'dor-badge-no';
                const tsBadge = issue.tsStatus === 'Yes' ? 'dor-badge-yes' : issue.tsStatus === 'N/A' ? 'dor-badge-na' : 'dor-badge-no';
                const typeBadge = issue.type === 'Story' ? 'dor-badge-story' : 'dor-badge-bug';
                const summary = (issue.summary || '').length > 60 ? issue.summary.substring(0, 60) + '...' : (issue.summary || '');
                const details = [];
                if (issue.hasPR) details.push('PR');
                if (issue.hasDescriptionLink) details.push('Doc Link');
                if (issue.isNA) details.push('N/A');
                if (issue.linkedToStory) details.push('→ Story');

                return `
                  <tr>
                    <td><a href="${jiraBase}${issue.key}" target="_blank" class="dor-key-link">${issue.key}</a></td>
                    <td><span class="dor-badge ${typeBadge}">${issue.type}</span></td>
                    <td style="font-size:12px; color:#8899aa;">${issue.team || '-'}</td>
                    <td style="max-width:250px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${(issue.summary || '').replace(/"/g, '&quot;')}">${summary}</td>
                    <td style="font-size:12px;">${issue.status || '-'}</td>
                    <td><span class="dor-badge ${tadBadge}">${issue.tadStatus || '-'}</span></td>
                    <td><span class="dor-badge ${tsBadge}">${issue.tsStatus || '-'}</span></td>
                    <td style="font-size:11px; color:#8899aa;">${details.join(', ') || '-'}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;
      }

      // Initialize
      console.log('🔵 Script loaded, setting up listeners');
      window.addEventListener('DOMContentLoaded', () => {
        console.log('🔵 DOMContentLoaded fired');
        loadProducts();
      });
      
      // Also try immediate load
      if (document.readyState !== 'loading') {
        console.log('🔵 Document already loaded, calling loadProducts immediately');
        loadProducts();
      }
    </script>
  </body>
</html>
