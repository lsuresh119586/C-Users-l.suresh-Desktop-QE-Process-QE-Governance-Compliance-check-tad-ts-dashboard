<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polaris ELM Metrics Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #0f0f1a;
        color: #e0e0e0;
      }

      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

      .dashboard {
        min-height: 100vh;
        background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 30%, #16213e 60%, #0f3460 100%);
        padding: 0;
      }

      .dashboard-header {
        background: linear-gradient(135deg, #00b4d8 0%, #0077b6 25%, #7b2ff7 50%, #c724b1 75%, #e91e63 100%);
        background-size: 200% 200%;
        animation: gradientShift 8s ease infinite;
        color: white;
        padding: 40px 20px;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0, 119, 182, 0.3);
        position: relative;
        overflow: hidden;
      }

      .dashboard-header::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
        animation: gradientShift 12s ease infinite reverse;
      }
      .dashboard-header-inner {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
      }

      .dashboard-header h1 {
        margin: 0;
        font-size: 2.5em;
        font-weight: 700;
      }

      .dashboard-header p {
        margin: 10px 0 0 0;
        font-size: 1.1em;
        opacity: 0.9;
      }

      .controls {
        display: flex;
        gap: 20px;
        padding: 30px;
        flex-wrap: wrap;
        justify-content: center;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        margin: 20px;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 200px;
      }

      .control-group label {
        font-weight: 600;
        color: #b8c5d9;
        font-size: 0.95em;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .control-group select {
        padding: 10px 12px;
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        font-size: 1em;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.08);
        color: #e0e0e0;
        transition: all 0.3s ease;
      }

      .control-group select:hover {
        border-color: #00b4d8;
        background: rgba(0, 180, 216, 0.1);
      }

      .control-group select:focus {
        outline: none;
        border-color: #00b4d8;
        box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.2);
      }

      .control-group select option {
        background: #1a1a2e;
        color: #e0e0e0;
      }

      .error-message {
        background: rgba(244, 67, 54, 0.1);
        color: #ff6b6b;
        padding: 15px 20px;
        margin: 20px;
        border-radius: 12px;
        border-left: 4px solid #ff6b6b;
        backdrop-filter: blur(10px);
      }

      .loading {
        text-align: center;
        padding: 40px 20px;
        font-size: 1.2em;
        color: #00b4d8;
        animation: pulse 1.5s infinite;
      }

      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        padding: 30px;
        max-width: 1400px;
        margin: 0 auto;
      }

      .metric-card {
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-left: 5px solid #00b4d8;
        animation: fadeInUp 0.6s ease-out backwards;
        position: relative;
        overflow: hidden;
      }

      .metric-card::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        background-size: 200% 100%;
        animation: shimmer 3s infinite;
      }

      .metric-card:nth-child(1) { animation-delay: 0.05s; }
      .metric-card:nth-child(2) { animation-delay: 0.1s; }
      .metric-card:nth-child(3) { animation-delay: 0.15s; }
      .metric-card:nth-child(4) { animation-delay: 0.2s; }
      .metric-card:nth-child(5) { animation-delay: 0.25s; }
      .metric-card:nth-child(6) { animation-delay: 0.3s; }
      .metric-card:nth-child(7) { animation-delay: 0.35s; }

      .metric-card:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        border-color: rgba(255, 255, 255, 0.2);
      }

      /* Color variants for metric cards */
      .metric-card.card-blue {
        border-left-color: #00b4d8;
        background: linear-gradient(135deg, rgba(0, 180, 216, 0.15) 0%, rgba(0, 119, 182, 0.08) 100%);
        box-shadow: 0 8px 32px rgba(0, 180, 216, 0.15);
      }
      .metric-card.card-blue:hover {
        box-shadow: 0 20px 40px rgba(0, 180, 216, 0.25);
      }

      .metric-card.card-green {
        border-left-color: #00e676;
        background: linear-gradient(135deg, rgba(0, 230, 118, 0.15) 0%, rgba(0, 200, 83, 0.08) 100%);
        box-shadow: 0 8px 32px rgba(0, 230, 118, 0.15);
      }
      .metric-card.card-green:hover {
        box-shadow: 0 20px 40px rgba(0, 230, 118, 0.25);
      }

      .metric-card.card-purple {
        border-left-color: #b388ff;
        background: linear-gradient(135deg, rgba(179, 136, 255, 0.15) 0%, rgba(124, 77, 255, 0.08) 100%);
        box-shadow: 0 8px 32px rgba(179, 136, 255, 0.15);
      }
      .metric-card.card-purple:hover {
        box-shadow: 0 20px 40px rgba(179, 136, 255, 0.25);
      }

      .metric-card.card-red {
        border-left-color: #ff5252;
        background: linear-gradient(135deg, rgba(255, 82, 82, 0.15) 0%, rgba(244, 67, 54, 0.08) 100%);
        box-shadow: 0 8px 32px rgba(255, 82, 82, 0.15);
      }
      .metric-card.card-red:hover {
        box-shadow: 0 20px 40px rgba(255, 82, 82, 0.25);
      }

      .metric-card.card-orange {
        border-left-color: #ffab40;
        background: linear-gradient(135deg, rgba(255, 171, 64, 0.15) 0%, rgba(255, 145, 0, 0.08) 100%);
        box-shadow: 0 8px 32px rgba(255, 171, 64, 0.15);
      }
      .metric-card.card-orange:hover {
        box-shadow: 0 20px 40px rgba(255, 171, 64, 0.25);
      }

      .metric-quality-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.75em;
        font-weight: 600;
        margin-top: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .quality-excellent {
        background: linear-gradient(135deg, #00e676, #00c853);
        color: white;
        box-shadow: 0 2px 8px rgba(0, 230, 118, 0.3);
      }

      .quality-fair {
        background: linear-gradient(135deg, #ffab40, #ff9100);
        color: white;
        box-shadow: 0 2px 8px rgba(255, 171, 64, 0.3);
      }

      .quality-action-required {
        background: linear-gradient(135deg, #ff5252, #d50000);
        color: white;
        box-shadow: 0 2px 8px rgba(255, 82, 82, 0.3);
      }

      .metric-label {
        color: #8899aa;
        font-size: 0.9em;
        font-weight: 600;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
      }

      .metric-value {
        font-size: 2.8em;
        font-weight: 800;
        background: linear-gradient(135deg, #00b4d8, #7c4dff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .card-blue .metric-value {
        background: linear-gradient(135deg, #00b4d8, #48cae4);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .card-green .metric-value {
        background: linear-gradient(135deg, #00e676, #69f0ae);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .card-purple .metric-value {
        background: linear-gradient(135deg, #b388ff, #ea80fc);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .card-red .metric-value {
        background: linear-gradient(135deg, #ff5252, #ff8a80);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .card-orange .metric-value {
        background: linear-gradient(135deg, #ffab40, #ffd740);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .no-data {
        text-align: center;
        padding: 40px 20px;
        color: #667;
        font-size: 1.1em;
      }

      .placeholder {
        text-align: center;
        padding: 60px 20px;
        color: #667;
        font-size: 1.1em;
      }

      /* ── Tests Covered inline view (matches React TestsCovered component) ── */
      .back-btn {
        background: linear-gradient(135deg, #00b4d8, #0077b6);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 180, 216, 0.3);
        position: relative;
        z-index: 2;
      }
      .back-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 180, 216, 0.4); }

      .tests-covered-container {
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .tests-covered-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 20px;
      }
      .tests-covered-header h1 {
        margin: 0; color: #e0e0e0; font-size: 28px;
      }

      .sprint-selector {
        display: flex; gap: 10px; align-items: center;
      }
      .sprint-selector label {
        font-weight: 600; color: #8899aa;
      }
      .sprint-selector select {
        padding: 8px 12px; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
        font-size: 14px; cursor: pointer; background: rgba(255,255,255,0.08); color: #e0e0e0;
      }
      .sprint-selector select option { background: #1a1a2e; color: #e0e0e0; }

      .tests-covered-summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 20px; margin-bottom: 40px;
      }

      .summary-card {
        background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
        padding: 20px; text-align: center;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        transition: transform 0.3s, box-shadow 0.3s;
        backdrop-filter: blur(10px);
      }
      .summary-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      }
      .summary-card.highlight {
        background: linear-gradient(135deg, #00b4d8 0%, #7c4dff 100%);
        color: white; border: none;
        box-shadow: 0 8px 30px rgba(0, 180, 216, 0.3);
      }
      .summary-card .card-label {
        font-size: 12px; font-weight: 600; color: #8899aa;
        text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px;
      }
      .summary-card.highlight .card-label { color: rgba(255,255,255,0.9); }
      .summary-card .card-value {
        font-size: 32px; font-weight: bold; color: #e0e0e0; margin-bottom: 10px;
      }
      .summary-card.highlight .card-value { color: white; }

      .tc-progress-bar {
        width: 100%; height: 6px;
        background: rgba(0,0,0,0.1); border-radius: 3px;
        overflow: hidden; margin-top: 10px;
      }
      .summary-card.highlight .tc-progress-bar { background: rgba(255,255,255,0.2); }
      .tc-progress-fill {
        height: 100%; background: linear-gradient(90deg, #00e676, #00b4d8, #7c4dff);
        border-radius: 3px; transition: width 0.3s ease;
      }
      .summary-card.highlight .tc-progress-fill { background: white; }

      .tests-covered-content {
        background: rgba(255,255,255,0.04); border-radius: 16px; padding: 30px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2); margin-bottom: 30px;
        border: 1px solid rgba(255,255,255,0.08);
        backdrop-filter: blur(10px);
      }
      .tests-covered-content h2 {
        margin-top: 0; color: #e0e0e0; margin-bottom: 20px; font-size: 20px;
      }

      .tc-teams-table { width: 100%; border-collapse: collapse; }
      .tc-teams-table thead { background: rgba(0, 180, 216, 0.1); }
      .tc-teams-table th {
        padding: 15px; text-align: left; font-weight: 600; color: #8899aa;
        border-bottom: 2px solid rgba(255,255,255,0.1); font-size: 13px;
        text-transform: uppercase; letter-spacing: 0.5px;
      }
      .tc-teams-table td {
        padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #c0c0c0;
      }
      .tc-teams-table tbody tr:hover { background: rgba(0, 180, 216, 0.05); }
      .tc-teams-table .tc-team-name { font-weight: 600; color: #00b4d8; }
      .tc-teams-table .tc-numeric { text-align: center; font-weight: 500; }
      .tc-teams-table .tc-coverage-cell { color: #00e676; font-weight: 600; text-align: center; }

      .tc-mini-progress {
        width: 100%; height: 4px; background: #e0e0e0;
        border-radius: 2px; overflow: hidden;
      }
      .tc-mini-progress-fill {
        height: 100%; background: linear-gradient(90deg, #00e676, #00b4d8);
        transition: width 0.3s ease;
      }

      .tests-covered-footer {
        text-align: center; color: #556; font-size: 12px;
        padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.08);
      }
      .tests-covered-footer p { margin: 5px 0; }

      .clickable { cursor: pointer; }
      .card-hint {
        font-size: 0.75em; color: rgba(255,255,255,0.4); margin-top: 8px;
      }

      @media (max-width: 768px) {
        .tests-covered-container { padding: 15px; }
        .tests-covered-header { flex-direction: column; gap: 15px; align-items: flex-start; }
        .tests-covered-header h1 { font-size: 22px; }
        .tests-covered-summary { grid-template-columns: 1fr 1fr; gap: 15px; }
        .summary-card .card-value { font-size: 24px; }
      }
    </style>
  </head>
  <body>
    <nav style="background: linear-gradient(135deg, #0d1b2a 0%, #1b2838 100%); color: white; padding: 12px 20px; text-align: center; border-bottom: 2px solid rgba(0,180,216,0.3);">
      <div style="max-width: 1400px; margin: 0 auto; display: flex; justify-content: flex-end; align-items: center;">
        <div style="display: flex; gap: 12px;">
          <a href="index.html" style="color: white; text-decoration: none; padding: 10px 18px; border-radius: 10px; background: linear-gradient(135deg, #00b4d8, #0077b6); font-weight: 600; box-shadow: 0 4px 15px rgba(0,180,216,0.3); transition: all 0.3s;">📊 Dashboard</a>
          <a href="unified-dashboard.html" style="color: #b8c5d9; text-decoration: none; padding: 10px 18px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); font-weight: 500; transition: all 0.3s;">📈 Unified Metrics</a>
        </div>
      </div>
    </nav>
    <div id="app"></div>
    <script>
      const API_BASE_URL = 'http://localhost:3000/api';

      let state = {
        products: [],
        teams: [],
        sprints: [],
        metrics: null,
        selectedProduct: '',
        selectedTeam: '',
        selectedSprint: '',
        loading: false,
        error: null,
        currentView: 'dashboard'
      };

      const apiService = {
        getProducts: async () => {
          try {
            const response = await fetch(`${API_BASE_URL}/products`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
          } catch (err) {
            console.error('❌ getProducts failed:', err);
            throw err;
          }
        },
        getTeams: async (product) => {
          try {
            const params = product ? `?product=${product}` : '';
            const response = await fetch(`${API_BASE_URL}/teams${params}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
          } catch (err) {
            console.error('❌ getTeams failed:', err);
            throw err;
          }
        },
        getSprints: async (team, product) => {
          try {
            let params = [];
            if (team) params.push(`team=${team}`);
            if (product) params.push(`product=${product}`);
            const query = params.length ? `?${params.join('&')}` : '';
            const response = await fetch(`${API_BASE_URL}/sprints${query}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
          } catch (err) {
            console.error('❌ getSprints failed:', err);
            throw err;
          }
        },
        getMetrics: async (product, team, sprint) => {
          try {
            let params = [];
            if (product) params.push(`product=${product}`);
            if (team) params.push(`team=${team}`);
            if (sprint) params.push(`sprint=${sprint}`);
            const query = params.length ? `?${params.join('&')}` : '';
            const response = await fetch(`${API_BASE_URL}/metrics${query}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
          } catch (err) {
            console.error('❌ getMetrics failed:', err);
            throw err;
          }
        }
      };

      async function loadProducts() {
        try {
          state.loading = true;
          console.log('🔵 STEP 1: Fetching products...');
          state.products = await apiService.getProducts();
          console.log('✅ Products loaded:', state.products);
          state.error = null;
        } catch (err) {
          console.error('❌ Error loading products:', err);
          state.error = 'Failed to load products: ' + err.message;
          state.loading = false;
          render();
          return;
        }
        
        // Auto-select first product and load its teams
        if (state.products.length > 0) {
          state.selectedProduct = state.products[0].id;
          console.log('🟠 STEP 2: Auto-selected product:', state.selectedProduct);
          
          try {
            console.log('🔵 STEP 3: Fetching teams for product:', state.selectedProduct);
            state.teams = await apiService.getTeams(state.selectedProduct);
            console.log('✅ Teams loaded:', state.teams);
            
            // Auto-select first team and load its sprints
            if (state.teams.length > 0) {
              state.selectedTeam = state.teams[0].id;
              console.log('🟠 STEP 4: Auto-selected team:', state.selectedTeam);
              
              try {
                console.log('🔵 STEP 5: Fetching sprints for team:', state.selectedTeam);
                state.sprints = await apiService.getSprints(state.selectedTeam, state.selectedProduct);
                console.log('✅ Sprints loaded:', state.sprints);
                
                // Auto-select first sprint and load metrics
                if (state.sprints.length > 0) {
                  state.selectedSprint = state.sprints[0].id;
                  console.log('🟠 STEP 6: Auto-selected sprint:', state.selectedSprint);
                  
                  try {
                    console.log('🔵 STEP 7: Fetching metrics...');
                    const metricsArray = await apiService.getMetrics(state.selectedProduct, state.selectedTeam, state.selectedSprint);
                    console.log('✅ Metrics response:', metricsArray);
                    
                    if (Array.isArray(metricsArray) && metricsArray.length > 0) {
                      state.metrics = metricsArray[0];
                      console.log('🟢 STEP 8: SUCCESS! Metrics set:', state.metrics);
                    } else {
                      console.warn('⚠️ Metrics array is empty');
                      state.metrics = null;
                    }
                  } catch (err) {
                    console.error('❌ Error loading metrics:', err);
                    state.error = 'Failed to load metrics: ' + err.message;
                  }
                }
              } catch (err) {
                console.error('❌ Error loading sprints:', err);
                state.error = 'Failed to load sprints: ' + err.message;
              }
            }
          } catch (err) {
            console.error('❌ Error loading teams:', err);
            state.error = 'Failed to load teams: ' + err.message;
          }
        }
        
        state.loading = false;
        render();
      }

      async function handleProductChange(e) {
        state.selectedProduct = e.target.value;
        if (!state.selectedProduct) {
          state.teams = [];
          state.sprints = [];
          state.selectedTeam = '';
          state.selectedSprint = '';
          state.metrics = null;
          render();
          return;
        }

        try {
          state.loading = true;
          console.log('📦 Loading teams for product:', state.selectedProduct);
          state.teams = await apiService.getTeams(state.selectedProduct);
          console.log('✅ Teams loaded:', state.teams);
          state.selectedTeam = '';
          state.selectedSprint = '';
          state.sprints = [];
          state.metrics = null;
          state.error = null;
          
          // Auto-select first team and cascade
          if (state.teams.length > 0) {
            state.selectedTeam = state.teams[0].id;
            console.log('👉 Auto-selecting first team:', state.selectedTeam);
            
            // Now load sprints for this team
            try {
              console.log('📦 Loading sprints for team:', state.selectedTeam);
              state.sprints = await apiService.getSprints(state.selectedTeam, state.selectedProduct);
              console.log('✅ Sprints loaded:', state.sprints);
              
              // Auto-select first sprint and load metrics
              if (state.sprints.length > 0) {
                state.selectedSprint = state.sprints[0].id;
                console.log('👉 Auto-selecting first sprint:', state.selectedSprint);
                
                // Load metrics for this sprint
                try {
                  console.log('📦 Loading metrics...');
                  const metricsArray = await apiService.getMetrics(state.selectedProduct, state.selectedTeam, state.selectedSprint);
                  console.log('✅ Metrics response:', metricsArray);
                  
                  if (Array.isArray(metricsArray) && metricsArray.length > 0) {
                    state.metrics = metricsArray[0];
                    console.log('🟢 SUCCESS! Metrics loaded:', state.metrics);
                  }
                } catch (err) {
                  console.error('❌ Error loading metrics:', err);
                  state.error = 'Failed to load metrics: ' + err.message;
                }
              }
            } catch (err) {
              console.error('❌ Error loading sprints:', err);
              state.error = 'Failed to load sprints: ' + err.message;
            }
          }
        } catch (err) {
          console.error('❌ Error loading teams:', err);
          state.error = 'Failed to load teams: ' + err.message;
        } finally {
          state.loading = false;
        }
        render();
      }

      async function handleTeamChange(e) {
        state.selectedTeam = e.target.value;
        if (!state.selectedTeam) {
          state.sprints = [];
          state.selectedSprint = '';
          state.metrics = null;
          render();
          return;
        }

        try {
          state.loading = true;
          console.log('📦 Loading sprints for team:', state.selectedTeam);
          state.sprints = await apiService.getSprints(state.selectedTeam, state.selectedProduct);
          console.log('✅ Sprints loaded:', state.sprints);
          state.selectedSprint = '';
          state.metrics = null;
          state.error = null;
          
          // Auto-select first sprint and load metrics
          if (state.sprints.length > 0) {
            state.selectedSprint = state.sprints[0].id;
            console.log('👉 Auto-selecting first sprint:', state.selectedSprint);
            render();
            
            // Load metrics for this sprint
            try {
              console.log('📦 Loading metrics...');
              const metricsArray = await apiService.getMetrics(state.selectedProduct, state.selectedTeam, state.selectedSprint);
              console.log('✅ Metrics response:', metricsArray);
              
              if (Array.isArray(metricsArray) && metricsArray.length > 0) {
                state.metrics = metricsArray[0];
                console.log('🟢 SUCCESS! Metrics loaded:', state.metrics);
              }
            } catch (err) {
              console.error('❌ Error loading metrics:', err);
              state.error = 'Failed to load metrics: ' + err.message;
            }
          }
        } catch (err) {
          console.error('❌ Error loading sprints:', err);
          state.error = 'Failed to load sprints: ' + err.message;
        } finally {
          state.loading = false;
        }
        render();
      }

      async function handleSprintChange(e) {
        state.selectedSprint = e.target.value;
        await loadMetrics(state.selectedProduct, state.selectedTeam, state.selectedSprint);
      }

      async function loadMetrics(product, team, sprint) {
        if (!product) {
          state.metrics = null;
          render();
          return;
        }

        try {
          state.loading = true;
          const metricsArray = await apiService.getMetrics(product, team, sprint);
          console.log('Metrics response:', metricsArray);
          
          // API returns an array, but we want a single metric object
          if (Array.isArray(metricsArray) && metricsArray.length > 0) {
            state.metrics = metricsArray[0];
            console.log('Selected first metric:', state.metrics);
          } else {
            state.metrics = null;
            console.log('No metrics found for:', { product, team, sprint });
          }
          
          state.error = null;
        } catch (err) {
          state.error = 'Failed to load metrics: ' + err.message;
          console.error('Error loading metrics:', err);
        } finally {
          state.loading = false;
        }
        render();
      }

      function render() {
        const app = document.getElementById('app');

        // Show Tests Covered view if selected
        if (state.currentView === 'testsCovered') {
          let html = `
            <div class="dashboard">
              <header class="dashboard-header" style="padding: 15px 20px; text-align: left;">
                <button class="back-btn" id="backBtn">← Back to Dashboard</button>
              </header>
              <div id="testsCoveredContainer"></div>
            </div>
          `;
          app.innerHTML = html;

          document.getElementById('backBtn').addEventListener('click', () => {
            state.currentView = 'dashboard';
            render();
          });

          loadTestsCoveredView();
          return;
        }

        // Show main dashboard view
        let html = `
          <div class="dashboard">
            <header class="dashboard-header">
              <div class="dashboard-header-inner">
                <img src="/public/wk-logo.svg" alt="Wolters Kluwer" style="height: 224px; width: auto; display: block;" />
                <h1>📊 Polaris ELM Metrics Dashboard</h1>
              </div>
              <p>Hierarchical Metrics View: Product → Team → Sprint</p>
            </header>

            ${state.error ? `<div class="error-message">${state.error}</div>` : ''}

            <div class="controls">
              <div class="control-group">
                <label for="product">Product</label>
                <select id="product">
                  <option value="">-- Select Product --</option>
                  ${state.products.map(p => `
                    <option value="${p.id}" ${p.id === state.selectedProduct ? 'selected' : ''}>
                      ${p.name}
                    </option>
                  `).join('')}
                </select>
              </div>

              ${state.teams.length > 0 ? `
                <div class="control-group">
                  <label for="team">Team</label>
                  <select id="team">
                    <option value="">-- All Teams --</option>
                    ${state.teams.map(t => `
                      <option value="${t.id}" ${t.id === state.selectedTeam ? 'selected' : ''}>
                        ${t.name}
                      </option>
                    `).join('')}
                  </select>
                </div>
              ` : ''}

              ${state.sprints.length > 0 ? `
                <div class="control-group">
                  <label for="sprint">Sprint</label>
                  <select id="sprint">
                    <option value="">-- All Sprints --</option>
                    ${state.sprints.map(s => `
                      <option value="${s.id}" ${s.id === state.selectedSprint ? 'selected' : ''}>
                        ${s.name}
                      </option>
                    `).join('')}
                  </select>
                </div>
              ` : ''}
            </div>

            ${state.loading ? '<div class="loading">Loading...</div>' : ''}

            ${state.metrics ? `
              <div class="metrics-grid">
                <div class="metric-card card-blue">
                  <div class="metric-label">📋 DoR Readiness %</div>
                  <div class="metric-value">${state.metrics.requirementsCovered}%</div>
                </div>
                <div class="metric-card card-green clickable" id="testsCoveredCard">
                  <div class="metric-label">✅ Automation Coverage %</div>
                  <div class="metric-value">${state.metrics.testsCovered}%</div>
                  <div class="card-hint">Click to view details →</div>
                </div>
                <div class="metric-card card-purple">
                  <div class="metric-label">🚨 Open Defects</div>
                  <div class="metric-value">${state.metrics.defectsOpen}</div>
                </div>
                <div class="metric-card card-red">
                  <div class="metric-label">✓ Closed Defects</div>
                  <div class="metric-value">${state.metrics.defectsClosed}</div>
                </div>
                <div class="metric-card card-orange">
                  <div class="metric-label">↩️ Reopened Defects</div>
                  <div class="metric-value">${state.metrics.reopenedRate !== undefined && state.metrics.reopenedRate !== null ? Math.round(state.metrics.reopenedRate) + '%' : '0%'}</div>
                  <div class="metric-quality-badge ${
                    state.metrics.reopenedRate !== undefined && state.metrics.reopenedRate !== null
                      ? (state.metrics.reopenedRate < 10 ? 'quality-excellent' : state.metrics.reopenedRate <= 25 ? 'quality-fair' : 'quality-action-required')
                      : 'quality-excellent'
                  }">${
                    state.metrics.reopenedRate !== undefined && state.metrics.reopenedRate !== null
                      ? (state.metrics.reopenedRate < 10 ? 'Excellent' : state.metrics.reopenedRate <= 25 ? 'Fair' : 'Action Required')
                      : 'Excellent'
                  }</div>
                </div>
                <div class="metric-card card-blue">
                  <div class="metric-label">🚀 DoD Completion/Release Readiness %</div>
                  <div class="metric-value">${state.metrics.deploymentReadiness}%</div>
                </div>
                <div class="metric-card card-green">
                  <div class="metric-label">⭐ Automation Code Quality</div>
                  <div class="metric-value">${state.metrics.codeQuality}%</div>
                </div>
              </div>
            ` : !state.loading && state.selectedProduct ? `
              <div class="no-data">No metrics available for selected combination</div>
            ` : !state.selectedProduct ? `
              <div class="placeholder">Select a product to view metrics</div>
            ` : ''}
          </div>
        `;

        app.innerHTML = html;

        // Attach event listeners (remove old ones first)
        const productSelect = document.getElementById('product');
        if (productSelect) {
          productSelect.removeEventListener('change', handleProductChange);
          productSelect.addEventListener('change', handleProductChange);
          console.log('📌 Product dropdown listener attached');
        }
        
        const teamSelect = document.getElementById('team');
        if (teamSelect && state.teams.length > 0) {
          teamSelect.removeEventListener('change', handleTeamChange);
          teamSelect.addEventListener('change', handleTeamChange);
          console.log('📌 Team dropdown listener attached');
        }
        
        const sprintSelect = document.getElementById('sprint');
        if (sprintSelect && state.sprints.length > 0) {
          sprintSelect.removeEventListener('change', handleSprintChange);
          sprintSelect.addEventListener('change', handleSprintChange);
          console.log('📌 Sprint dropdown listener attached');
        }

        // Tests Covered card click handler
        document.getElementById('testsCoveredCard')?.addEventListener('click', () => {
          state.currentView = 'testsCovered';
          render();
        });
      }

      // Product-to-team mapping (team names as they appear in tests_covered data)
      const productTeamMap = {
        't360': ['Chargers', 'Chubb', 'Matrix', 'Mavericks', 'Nexus', 'Vanguards'],
        'dna': ['Minerva', 'Guardians', 'Athena'],
        'passport': ['Team A', 'Team B', 'Team C'],
        'collaboration-portal': []
      };

      async function loadTestsCoveredView() {
        const container = document.getElementById('testsCoveredContainer');
        if (!container) return;

        const selectedProduct = state.selectedProduct;

        try {
          const response = await fetch('http://localhost:3000/api/metrics/tests-covered');
          const result = await response.json();
          // API returns { status, data: { "26.1.1": {...}, ... }, available_sprints: [...] }
          const allData = result.data || {};
          const sprints = result.available_sprints || Object.keys(allData);

          if (sprints.length === 0) {
            container.innerHTML = '<div class="no-data">No sprint data available</div>';
            return;
          }

          const selectedSprint = sprints[0];
          renderTestsCoveredDashboard(allData, sprints, selectedSprint, selectedProduct);

          const selector = document.getElementById('testsCoveredSprintSelector');
          if (selector) {
            selector.addEventListener('change', (e) => {
              renderTestsCoveredDashboard(allData, sprints, e.target.value, selectedProduct);
            });
          }
        } catch (error) {
          console.error('Error loading tests covered:', error);
          container.innerHTML = `<div class="error-message">Error loading data: ${error.message}</div>`;
        }
      }

      function renderTestsCoveredDashboard(allData, sprints, selectedSprint, selectedProduct) {
        const container = document.getElementById('testsCoveredContainer');
        const data = allData[selectedSprint] || {};

        // Convert teams object to array
        const teamsObj = data.teams || {};
        let teams = Object.entries(teamsObj).map(([name, stats]) => ({
          name,
          total: stats.total_test_cases || 0,
          automated: stats.automated_test_cases || 0,
          coverage: stats.automation_coverage_percent || 0,
          withAttachments: stats.with_attachments || 0
        }));

        // Filter teams by selected product
        if (selectedProduct) {
          const allowedTeams = (productTeamMap[selectedProduct] || []).map(t => t.toLowerCase());
          if (allowedTeams.length > 0) {
            teams = teams.filter(t => allowedTeams.includes(t.name.toLowerCase()));
          }
          // If product has no mapped teams or no matches, teams will be empty
        }

        // Recalculate summary from filtered teams
        const totalTests = teams.reduce((sum, t) => sum + t.total, 0);
        const automatedTests = teams.reduce((sum, t) => sum + t.automated, 0);
        const withAttachments = teams.reduce((sum, t) => sum + t.withAttachments, 0);
        const teamsCount = teams.length;
        const coverage = totalTests > 0 ? ((automatedTests / totalTests) * 100).toFixed(1) : 0;

        // Format product name for display
        const productLabel = selectedProduct 
          ? selectedProduct.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase())
          : 'All Products';

        let html = `
          <div class="tests-covered-container">
            <div class="tests-covered-header">
              <h1>🧪 Tests Covered — ${productLabel}</h1>
              <div class="sprint-selector">
                <label>Sprint: </label>
                <select id="testsCoveredSprintSelector">
                  ${sprints.map(s => `<option value="${s}" ${s === selectedSprint ? 'selected' : ''}>${s}</option>`).join('')}
                </select>
              </div>
            </div>

            ${teams.length === 0 ? `
              <div class="no-data" style="text-align:center; padding:40px; color:#999; font-size:1.1em;">
                No test coverage data available for <strong>${productLabel}</strong>.<br/>
                Test coverage data is currently tracked for T360 teams only.
              </div>
            ` : `
            <div class="tests-covered-summary">
              <div class="summary-card">
                <div class="card-label">Total Test Cases</div>
                <div class="card-value">${totalTests}</div>
              </div>
              <div class="summary-card">
                <div class="card-label">Automated</div>
                <div class="card-value">${automatedTests}</div>
              </div>
              <div class="summary-card highlight">
                <div class="card-label">Automation Coverage</div>
                <div class="card-value">${coverage}%</div>
                <div class="tc-progress-bar">
                  <div class="tc-progress-fill" style="width: ${coverage}%"></div>
                </div>
              </div>
              <div class="summary-card">
                <div class="card-label">With Scripts</div>
                <div class="card-value">${withAttachments}</div>
              </div>
              <div class="summary-card">
                <div class="card-label">Teams</div>
                <div class="card-value">${teamsCount}</div>
              </div>
            </div>

            <div class="tests-covered-content">
              <h2>👥 Team Breakdown</h2>
              ${teams.length > 0 ? `
                <table class="tc-teams-table">
                  <thead>
                    <tr>
                      <th>Team</th>
                      <th class="tc-numeric">Total Tests</th>
                      <th class="tc-numeric">Automated</th>
                      <th class="tc-numeric">Coverage %</th>
                      <th>Progress</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${teams.map(team => {
                      const pct = team.coverage.toFixed ? team.coverage.toFixed(1) : team.coverage;
                      return `
                        <tr>
                          <td class="tc-team-name">${team.name}</td>
                          <td class="tc-numeric">${team.total}</td>
                          <td class="tc-numeric">${team.automated}</td>
                          <td class="tc-coverage-cell">${pct}%</td>
                          <td>
                            <div class="tc-mini-progress">
                              <div class="tc-mini-progress-fill" style="width: ${team.coverage}%"></div>
                            </div>
                          </td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              ` : '<div class="no-data">No team data available</div>'}
            </div>

            <div class="tests-covered-footer">
              <p>Generated: ${data.generated || 'N/A'}</p>
              <p>Sprint: ${data.sprint || selectedSprint}</p>
            </div>
            `}
          </div>
        `;

        container.innerHTML = html;

        const selector = document.getElementById('testsCoveredSprintSelector');
        if (selector) {
          selector.addEventListener('change', (e) => {
            renderTestsCoveredDashboard(allData, sprints, e.target.value, selectedProduct);
          });
        }
      }

      // Initialize
      console.log('🔵 Script loaded, setting up listeners');
      window.addEventListener('DOMContentLoaded', () => {
        console.log('🔵 DOMContentLoaded fired');
        loadProducts();
      });
      
      // Also try immediate load
      if (document.readyState !== 'loading') {
        console.log('🔵 Document already loaded, calling loadProducts immediately');
        loadProducts();
      }
    </script>
  </body>
</html>
