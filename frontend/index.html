<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polaris ELM Metrics Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #0f0f1a;
        color: #e0e0e0;
      }

      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

      .dashboard {
        min-height: 100vh;
        background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 30%, #16213e 60%, #0f3460 100%);
        padding: 0;
      }

      .dashboard-header {
        background: linear-gradient(135deg, #00b4d8 0%, #0077b6 25%, #7b2ff7 50%, #c724b1 75%, #e91e63 100%);
        background-size: 200% 200%;
        animation: gradientShift 8s ease infinite;
        color: white;
        padding: 40px 20px;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0, 119, 182, 0.3);
        position: relative;
        overflow: hidden;
      }

      .dashboard-header::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
        animation: gradientShift 12s ease infinite reverse;
      }
      .dashboard-header-inner {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
      }

      .dashboard-header h1 {
        margin: 0;
        font-size: 2.5em;
        font-weight: 700;
      }

      .dashboard-header p {
        margin: 10px 0 0 0;
        font-size: 1.1em;
        opacity: 0.9;
      }

      .controls {
        display: flex;
        gap: 20px;
        padding: 30px;
        flex-wrap: wrap;
        justify-content: center;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        margin: 20px;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 200px;
      }

      .control-group label {
        font-weight: 600;
        color: #b8c5d9;
        font-size: 0.95em;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .control-group select {
        padding: 10px 12px;
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        font-size: 1em;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.08);
        color: #e0e0e0;
        transition: all 0.3s ease;
      }

      .control-group select:hover {
        border-color: #00b4d8;
        background: rgba(0, 180, 216, 0.1);
      }

      .control-group select:focus {
        outline: none;
        border-color: #00b4d8;
        box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.2);
      }

      .control-group input[type="date"] {
        padding: 10px 12px;
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        font-size: 1em;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.08);
        color: #e0e0e0;
        transition: all 0.3s ease;
        color-scheme: dark;
      }

      .control-group input[type="date"]:hover {
        border-color: #00b4d8;
        background: rgba(0, 180, 216, 0.1);
      }

      .control-group input[type="date"]:focus {
        outline: none;
        border-color: #00b4d8;
        box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.2);
      }

      .cpod-date-controls {
        display: flex;
        gap: 12px;
        align-items: flex-end;
      }

      .cpod-date-controls .control-group {
        min-width: 160px;
      }

      .cpod-load-btn {
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #00b4d8, #0096c7);
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        height: fit-content;
        align-self: flex-end;
      }

      .cpod-load-btn:hover {
        background: linear-gradient(135deg, #0096c7, #0077b6);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(0, 180, 216, 0.3);
      }

      .control-group select option {
        background: #1a1a2e;
        color: #e0e0e0;
      }

      .error-message {
        background: rgba(244, 67, 54, 0.1);
        color: #ff6b6b;
        padding: 15px 20px;
        margin: 20px;
        border-radius: 12px;
        border-left: 4px solid #ff6b6b;
        backdrop-filter: blur(10px);
      }

      .loading {
        text-align: center;
        padding: 40px 20px;
        font-size: 1.2em;
        color: #00b4d8;
        animation: pulse 1.5s infinite;
      }

      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        padding: 30px;
        max-width: 1400px;
        margin: 0 auto;
      }

      .metric-card {
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-left: 5px solid #00b4d8;
        animation: fadeInUp 0.6s ease-out backwards;
        position: relative;
        overflow: hidden;
      }

      .metric-card::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        background-size: 200% 100%;
        animation: shimmer 3s infinite;
      }

      .metric-card:nth-child(1) { animation-delay: 0.05s; }
      .metric-card:nth-child(2) { animation-delay: 0.1s; }
      .metric-card:nth-child(3) { animation-delay: 0.15s; }
      .metric-card:nth-child(4) { animation-delay: 0.2s; }
      .metric-card:nth-child(5) { animation-delay: 0.25s; }
      .metric-card:nth-child(6) { animation-delay: 0.3s; }
      .metric-card:nth-child(7) { animation-delay: 0.35s; }

      .metric-card:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        border-color: rgba(255, 255, 255, 0.2);
      }

      /* Color variants for metric cards */
      .metric-card.card-blue {
        border-left-color: #00b4d8;
        background: linear-gradient(135deg, rgba(0, 180, 216, 0.15) 0%, rgba(0, 119, 182, 0.08) 100%);
        box-shadow: 0 8px 32px rgba(0, 180, 216, 0.15);
      }
      .metric-card.card-blue:hover {
        box-shadow: 0 20px 40px rgba(0, 180, 216, 0.25);
      }

      .metric-card.card-green {
        border-left-color: #00e676;
        background: linear-gradient(135deg, rgba(0, 230, 118, 0.15) 0%, rgba(0, 200, 83, 0.08) 100%);
        box-shadow: 0 8px 32px rgba(0, 230, 118, 0.15);
      }
      .metric-card.card-green:hover {
        box-shadow: 0 20px 40px rgba(0, 230, 118, 0.25);
      }

      .metric-card.card-purple {
        border-left-color: #b388ff;
        background: linear-gradient(135deg, rgba(179, 136, 255, 0.15) 0%, rgba(124, 77, 255, 0.08) 100%);
        box-shadow: 0 8px 32px rgba(179, 136, 255, 0.15);
      }
      .metric-card.card-purple:hover {
        box-shadow: 0 20px 40px rgba(179, 136, 255, 0.25);
      }

      .metric-card.card-red {
        border-left-color: #ff5252;
        background: linear-gradient(135deg, rgba(255, 82, 82, 0.15) 0%, rgba(244, 67, 54, 0.08) 100%);
        box-shadow: 0 8px 32px rgba(255, 82, 82, 0.15);
      }
      .metric-card.card-red:hover {
        box-shadow: 0 20px 40px rgba(255, 82, 82, 0.25);
      }

      .metric-card.card-orange {
        border-left-color: #ffab40;
        background: linear-gradient(135deg, rgba(255, 171, 64, 0.15) 0%, rgba(255, 145, 0, 0.08) 100%);
        box-shadow: 0 8px 32px rgba(255, 171, 64, 0.15);
      }
      .metric-card.card-orange:hover {
        box-shadow: 0 20px 40px rgba(255, 171, 64, 0.25);
      }

      .metric-quality-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.75em;
        font-weight: 600;
        margin-top: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .quality-excellent {
        background: linear-gradient(135deg, #00e676, #00c853);
        color: white;
        box-shadow: 0 2px 8px rgba(0, 230, 118, 0.3);
      }

      .quality-fair {
        background: linear-gradient(135deg, #ffab40, #ff9100);
        color: white;
        box-shadow: 0 2px 8px rgba(255, 171, 64, 0.3);
      }

      .quality-action-required {
        background: linear-gradient(135deg, #ff5252, #d50000);
        color: white;
        box-shadow: 0 2px 8px rgba(255, 82, 82, 0.3);
      }

      .metric-label {
        color: #8899aa;
        font-size: 0.9em;
        font-weight: 600;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
      }

      .metric-value {
        font-size: 2.8em;
        font-weight: 800;
        background: linear-gradient(135deg, #00b4d8, #7c4dff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .card-blue .metric-value {
        background: linear-gradient(135deg, #00b4d8, #48cae4);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .card-green .metric-value {
        background: linear-gradient(135deg, #00e676, #69f0ae);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .card-purple .metric-value {
        background: linear-gradient(135deg, #b388ff, #ea80fc);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .card-red .metric-value {
        background: linear-gradient(135deg, #ff5252, #ff8a80);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .card-orange .metric-value {
        background: linear-gradient(135deg, #ffab40, #ffd740);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .no-data {
        text-align: center;
        padding: 40px 20px;
        color: #667;
        font-size: 1.1em;
      }

      .placeholder {
        text-align: center;
        padding: 60px 20px;
        color: #667;
        font-size: 1.1em;
      }

      /* ── Tests Covered inline view (matches React TestsCovered component) ── */
      .back-btn {
        background: linear-gradient(135deg, #00b4d8, #0077b6);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 180, 216, 0.3);
        position: relative;
        z-index: 2;
      }
      .back-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 180, 216, 0.4); }

      .tests-covered-container {
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .tests-covered-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 20px;
      }
      .tests-covered-header h1 {
        margin: 0; color: #e0e0e0; font-size: 28px;
      }

      .sprint-selector {
        display: flex; gap: 10px; align-items: center;
      }
      .sprint-selector label {
        font-weight: 600; color: #8899aa;
      }
      .sprint-selector select {
        padding: 8px 12px; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
        font-size: 14px; cursor: pointer; background: rgba(255,255,255,0.08); color: #e0e0e0;
      }
      .sprint-selector select option { background: #1a1a2e; color: #e0e0e0; }

      .tests-covered-summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 20px; margin-bottom: 40px;
      }

      .summary-card {
        background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
        padding: 20px; text-align: center;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        transition: transform 0.3s, box-shadow 0.3s;
        backdrop-filter: blur(10px);
      }
      .summary-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      }
      .summary-card.highlight {
        background: linear-gradient(135deg, #00b4d8 0%, #7c4dff 100%);
        color: white; border: none;
        box-shadow: 0 8px 30px rgba(0, 180, 216, 0.3);
      }
      .summary-card .card-label {
        font-size: 12px; font-weight: 600; color: #8899aa;
        text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px;
      }
      .summary-card.highlight .card-label { color: rgba(255,255,255,0.9); }
      .summary-card .card-value {
        font-size: 32px; font-weight: bold; color: #e0e0e0; margin-bottom: 10px;
      }
      .summary-card.highlight .card-value { color: white; }

      .tc-progress-bar {
        width: 100%; height: 6px;
        background: rgba(0,0,0,0.1); border-radius: 3px;
        overflow: hidden; margin-top: 10px;
      }
      .summary-card.highlight .tc-progress-bar { background: rgba(255,255,255,0.2); }
      .tc-progress-fill {
        height: 100%; background: linear-gradient(90deg, #00e676, #00b4d8, #7c4dff);
        border-radius: 3px; transition: width 0.3s ease;
      }
      .summary-card.highlight .tc-progress-fill { background: white; }

      .tests-covered-content {
        background: rgba(255,255,255,0.04); border-radius: 16px; padding: 30px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2); margin-bottom: 30px;
        border: 1px solid rgba(255,255,255,0.08);
        backdrop-filter: blur(10px);
      }
      .tests-covered-content h2 {
        margin-top: 0; color: #e0e0e0; margin-bottom: 20px; font-size: 20px;
      }

      .tc-teams-table { width: 100%; border-collapse: collapse; }
      .tc-teams-table thead { background: rgba(0, 180, 216, 0.1); }
      .tc-teams-table th {
        padding: 15px; text-align: left; font-weight: 600; color: #8899aa;
        border-bottom: 2px solid rgba(255,255,255,0.1); font-size: 13px;
        text-transform: uppercase; letter-spacing: 0.5px;
      }
      .tc-teams-table td {
        padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #c0c0c0;
      }
      .tc-teams-table tbody tr:hover { background: rgba(0, 180, 216, 0.05); }
      .tc-teams-table .tc-team-name { font-weight: 600; color: #00b4d8; }
      .tc-teams-table .tc-numeric { text-align: center; font-weight: 500; }
      .tc-teams-table .tc-coverage-cell { color: #00e676; font-weight: 600; text-align: center; }

      .tc-mini-progress {
        width: 100%; height: 4px; background: #e0e0e0;
        border-radius: 2px; overflow: hidden;
      }
      .tc-mini-progress-fill {
        height: 100%; background: linear-gradient(90deg, #00e676, #00b4d8);
        transition: width 0.3s ease;
      }

      .tests-covered-footer {
        text-align: center; color: #556; font-size: 12px;
        padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.08);
      }
      .tests-covered-footer p { margin: 5px 0; }

      .clickable { cursor: pointer; }
      .card-hint {
        font-size: 0.75em; color: rgba(255,255,255,0.4); margin-top: 8px;
      }

      /* ── Defect Detail View ── */
      .defect-detail-container {
        padding: 20px;
        max-width: 1400px;
        margin: 0 auto;
      }
      .defect-detail-header {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 24px; padding-bottom: 16px;
        border-bottom: 2px solid rgba(255,255,255,0.1);
      }
      .defect-detail-header h1 {
        font-size: 24px; color: #e0e0e0; margin: 0;
      }
      .defect-summary-cards {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px; margin-bottom: 24px;
      }
      .defect-summary-card {
        background: rgba(255,255,255,0.06); border-radius: 12px;
        padding: 16px; text-align: center;
        border: 1px solid rgba(255,255,255,0.08);
      }
      .defect-summary-card .ds-label { font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 1px; }
      .defect-summary-card .ds-value { font-size: 28px; font-weight: 700; color: #fff; margin-top: 4px; }
      .defect-summary-card.ds-open .ds-value { color: #b388ff; }
      .defect-summary-card.ds-closed .ds-value { color: #69f0ae; }
      .defect-summary-card.ds-reopened .ds-value { color: #ffab40; }
      .defect-summary-card.ds-critical .ds-value { color: #ff5252; }
      .defect-summary-card.ds-high .ds-value { color: #ff9100; }
      .defect-bugs-table {
        width: 100%; border-collapse: collapse;
        background: rgba(255,255,255,0.04); border-radius: 12px; overflow: hidden;
      }
      .defect-bugs-table thead { background: rgba(255,255,255,0.08); }
      .defect-bugs-table th {
        padding: 12px 16px; text-align: left; font-size: 12px;
        color: #aaa; text-transform: uppercase; letter-spacing: 1px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }
      .defect-bugs-table td {
        padding: 10px 16px; color: #ddd; font-size: 13px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
      }
      .defect-bugs-table tr:hover { background: rgba(255,255,255,0.06); }
      .defect-bugs-table .bug-key {
        font-weight: 600; color: #64b5f6;
      }
      .defect-bugs-table .bug-key a {
        color: #64b5f6; text-decoration: none;
      }
      .defect-bugs-table .bug-key a:hover { text-decoration: underline; }
      .defect-priority-badge {
        display: inline-block; padding: 2px 8px; border-radius: 4px;
        font-size: 11px; font-weight: 600; text-transform: uppercase;
      }
      .priority-critical { background: rgba(255,82,82,0.2); color: #ff5252; }
      .priority-high { background: rgba(255,145,0,0.2); color: #ff9100; }
      .priority-medium { background: rgba(255,235,59,0.2); color: #ffeb3b; }
      .priority-low { background: rgba(105,240,174,0.2); color: #69f0ae; }
      .defect-status-badge {
        display: inline-block; padding: 2px 8px; border-radius: 4px;
        font-size: 11px; font-weight: 600;
      }
      .status-open { background: rgba(179,136,255,0.2); color: #b388ff; }
      .status-closed { background: rgba(105,240,174,0.2); color: #69f0ae; }
      .status-in-progress { background: rgba(100,181,246,0.2); color: #64b5f6; }
      .status-reopened { background: rgba(255,171,64,0.2); color: #ffab40; }
      .defect-team-section {
        margin-bottom: 24px;
      }
      .defect-team-section h3 {
        font-size: 16px; color: #b0bec5; margin: 0 0 12px 0;
        padding: 8px 16px; background: rgba(255,255,255,0.06);
        border-radius: 8px; border-left: 3px solid #64b5f6;
      }
      .defect-no-data {
        text-align: center; padding: 40px; color: #777; font-size: 14px;
      }

      /* ── DoR Compliance / TAD-TS view ── */
      .dor-compliance-container {
        padding: 20px;
        max-width: 1400px;
        margin: 0 auto;
      }
      .dor-header {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 30px; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 20px;
      }
      .dor-header h1 { margin: 0; color: #e0e0e0; font-size: 28px; }
      .dor-sprint-selector {
        display: flex; gap: 10px; align-items: center;
      }
      .dor-sprint-selector label { font-weight: 600; color: #8899aa; }
      .dor-sprint-selector select {
        padding: 8px 12px; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
        font-size: 14px; cursor: pointer; background: rgba(255,255,255,0.08); color: #e0e0e0;
      }
      .dor-sprint-selector select option { background: #1a1a2e; color: #e0e0e0; }
      .dor-sprint-selector button {
        padding: 8px 18px; border: none; border-radius: 8px; cursor: pointer;
        font-weight: 600; font-size: 14px; transition: all 0.3s ease;
        background: linear-gradient(135deg, #00b4d8, #0077b6); color: white;
        box-shadow: 0 4px 15px rgba(0,180,216,0.3);
      }
      .dor-sprint-selector button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,180,216,0.4); }
      .dor-sprint-selector button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

      .dor-summary-grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));

      .dor-summary-card {

        padding: 20px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        transition: transform 0.3s, box-shadow 0.3s; backdrop-filter: blur(10px);

      .dor-summary-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
      .dor-summary-card .dor-card-label {

        letter-spacing: 0.5px; margin-bottom: 10px;
      }
      .dor-summary-card .dor-card-value {
        font-size: 32px; font-weight: bold; color: #e0e0e0; margin-bottom: 5px;
      }
      .dor-summary-card.dor-highlight {
        background: linear-gradient(135deg, #00b4d8 0%, #7c4dff 100%);
        color: white; border: none; box-shadow: 0 8px 30px rgba(0,180,216,0.3);
      }
      .dor-summary-card.dor-highlight .dor-card-label { color: rgba(255,255,255,0.9); }
      .dor-summary-card.dor-highlight .dor-card-value { color: white; }
      .dor-summary-card.dor-tad { border-left: 4px solid #00b4d8; }
      .dor-summary-card.dor-ts { border-left: 4px solid #7c4dff; }
      .dor-summary-card.dor-both { border-left: 4px solid #00e676; }
      .dor-summary-card.dor-na { border-left: 4px solid #ffab40; }

      .dor-compliance-pct {
        font-size: 14px; font-weight: 600; margin-top: 5px;
      }
      .dor-pct-good { color: #00e676; }
      .dor-pct-warn { color: #ffab40; }
      .dor-pct-bad { color: #ff5252; }

      .dor-team-section {
        background: rgba(255,255,255,0.04); border-radius: 16px; padding: 30px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2); margin-bottom: 30px;
        border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(10px);
      }
      .dor-team-section h2 { margin-top: 0; color: #e0e0e0; margin-bottom: 20px; font-size: 20px; }

      .dor-team-table { width: 100%; border-collapse: collapse; }
      .dor-team-table thead { background: rgba(0, 180, 216, 0.1); }
      .dor-team-table th {
        padding: 15px; text-align: left; font-weight: 600; color: #8899aa;
        border-bottom: 2px solid rgba(255,255,255,0.1); font-size: 13px;
        text-transform: uppercase; letter-spacing: 0.5px;
      }
      .dor-team-table td {
        padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #c0c0c0;
      }
      .dor-team-table tbody tr:hover { background: rgba(0, 180, 216, 0.05); }
      .dor-team-table .dor-team-name { font-weight: 600; color: #00b4d8; }
      .dor-team-table .dor-numeric { text-align: center; font-weight: 500; }

      .dor-issues-section {
        background: rgba(255,255,255,0.04); border-radius: 16px; padding: 30px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2); margin-bottom: 30px;
        border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(10px);
      }
      .dor-issues-section h2 { margin-top: 0; color: #e0e0e0; margin-bottom: 20px; font-size: 20px; }

      .dor-issue-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .dor-issue-table thead { background: rgba(0, 180, 216, 0.1); }
      .dor-issue-table th {
        padding: 12px 10px; text-align: left; font-weight: 600; color: #8899aa;
        border-bottom: 2px solid rgba(255,255,255,0.1); font-size: 12px;
        text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap;
      }
      .dor-issue-table td {
        padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #c0c0c0;
        vertical-align: top;
      }
      .dor-issue-table tbody tr:hover { background: rgba(0, 180, 216, 0.05); }
      .dor-issue-table .dor-key-link {
        color: #00b4d8; text-decoration: none; font-weight: 600;
      }
      .dor-issue-table .dor-key-link:hover { text-decoration: underline; color: #48cae4; }

      .dor-badge {
        display: inline-block; padding: 3px 8px; border-radius: 10px;
        font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px;

      .dor-badge-yes { background: rgba(0,230,118,0.2); color: #00e676; }
      .dor-badge-no { background: rgba(255,82,82,0.2); color: #ff5252; }
      .dor-badge-na { background: rgba(255,171,64,0.2); color: #ffab40; }
      .dor-badge-story { background: rgba(0,180,216,0.2); color: #00b4d8; }
      .dor-badge-bug { background: rgba(179,136,255,0.2); color: #b388ff; }

      .dor-filter-bar {
        display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center;

      .dor-filter-bar label { font-weight: 600; color: #8899aa; font-size: 13px; }
      .dor-filter-bar select {
        padding: 6px 10px; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
        font-size: 13px; cursor: pointer; background: rgba(255,255,255,0.08); color: #e0e0e0;
      }
      .dor-filter-bar select option { background: #1a1a2e; color: #e0e0e0; }

      .dor-loading {
        text-align: center; padding: 60px 20px; color: #00b4d8; font-size: 1.2em;
      }
      .dor-loading .dor-spinner {
        display: inline-block; width: 40px; height: 40px;
        border: 4px solid rgba(0,180,216,0.2); border-top-color: #00b4d8;
        border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 15px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      @media (max-width: 768px) {
        .tests-covered-container { padding: 15px; }

        .tests-covered-header h1 { font-size: 22px; }
        .tests-covered-summary { grid-template-columns: 1fr 1fr; gap: 15px; }
        .summary-card .card-value { font-size: 24px; }

    </style>
  </head>
  <body>
    <nav style="background: linear-gradient(135deg, #0d1b2a 0%, #1b2838 100%); color: white; padding: 12px 20px; text-align: center; border-bottom: 2px solid rgba(0,180,216,0.3);">
      <div style="max-width: 1400px; margin: 0 auto; display: flex; justify-content: flex-end; align-items: center;">
        <div style="display: flex; gap: 12px;">
          <a href="index.html" style="color: white; text-decoration: none; padding: 10px 18px; border-radius: 10px; background: linear-gradient(135deg, #00b4d8, #0077b6); font-weight: 600; box-shadow: 0 4px 15px rgba(0,180,216,0.3); transition: all 0.3s;">📊 Dashboard</a>
          <a href="unified-dashboard.html" style="color: #b8c5d9; text-decoration: none; padding: 10px 18px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); font-weight: 500; transition: all 0.3s;">📈 Unified Metrics</a>
        </div>
      </div>
    </nav>
    <div id="app"></div>
    <script>
      const API_BASE_URL = 'http://localhost:3000/api';

      let state = {
        products: [],
        teams: [],
        sprints: [],
        metrics: null,
        selectedProduct: '',
        selectedTeam: '',
        selectedSprint: '',
        cpodStartDate: '',
        cpodEndDate: '',
        loading: false,
        error: null,
        currentView: 'dashboard'
      };

      const apiService = {
        getProducts: async () => {
          try {
            const response = await fetch(`${API_BASE_URL}/products`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
          } catch (err) {
            console.error('❌ getProducts failed:', err);
            throw err;
          }
        },
        getTeams: async (product) => {
          try {
            const params = product ? `?product=${product}` : '';
            const response = await fetch(`${API_BASE_URL}/teams${params}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
          } catch (err) {
            console.error('❌ getTeams failed:', err);
            throw err;
          }
        },
        getSprints: async (team, product) => {
          try {
            let params = [];
            if (team) params.push(`team=${team}`);
            if (product) params.push(`product=${product}`);
            const query = params.length ? `?${params.join('&')}` : '';
            const response = await fetch(`${API_BASE_URL}/sprints${query}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const sprints = await response.json();
            // Sort sprints ascending (oldest first); IP sprints come last
            sprints.sort((a, b) => {
              const aId = a.id || a.name || '';
              const bId = b.id || b.name || '';
              if (aId.includes('IP') && !bId.includes('IP')) return 1;
              if (!aId.includes('IP') && bId.includes('IP')) return -1;
              const partsA = aId.split('.').map(Number);
              const partsB = bId.split('.').map(Number);
              for (let i = 0; i < Math.max(partsA.length, partsB.length); i++) {
                if ((partsA[i] || 0) !== (partsB[i] || 0)) return (partsA[i] || 0) - (partsB[i] || 0);
              }
              return 0;
            });
            return sprints;
          } catch (err) {
            console.error('❌ getSprints failed:', err);
            throw err;
          }
        },
        getMetrics: async (product, team, sprint, startDate, endDate) => {
          try {
            let params = [];
            if (product) params.push(`product=${product}`);
            if (team) params.push(`team=${team}`);
            if (sprint) params.push(`sprint=${sprint}`);
            if (startDate) params.push(`startDate=${startDate}`);
            if (endDate) params.push(`endDate=${endDate}`);
            const query = params.length ? `?${params.join('&')}` : '';
            const response = await fetch(`${API_BASE_URL}/metrics${query}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
          } catch (err) {
            console.error('❌ getMetrics failed:', err);
            throw err;
          }
        }
      };

      // Helper: check if the selected team is CPOD (uses date-range instead of sprint)
      function isCpodTeam() {
        return state.selectedProduct === 'passport' && state.selectedTeam === 'cpod';
      }

      // Load metrics using CPOD date-range or regular sprint mode
      async function loadMetricsAuto() {
        if (isCpodTeam()) {
          const startDate = state.cpodStartDate;
          const endDate = state.cpodEndDate;
          if (!startDate || !endDate) return;
          const metricsArray = await apiService.getMetrics(state.selectedProduct, state.selectedTeam, null, startDate, endDate);
          if (Array.isArray(metricsArray) && metricsArray.length > 0) {
            state.metrics = metricsArray[0];
          } else {
            state.metrics = null;
          }
        } else {
          const metricsArray = await apiService.getMetrics(state.selectedProduct, state.selectedTeam, state.selectedSprint);
          if (Array.isArray(metricsArray) && metricsArray.length > 0) {
            state.metrics = metricsArray[0];
          } else {
            state.metrics = null;
          }
        }
      }

      async function loadProducts() {
        try {
          state.loading = true;
          console.log('🔵 STEP 1: Fetching products...');
          state.products = await apiService.getProducts();
          console.log('✅ Products loaded:', state.products);
          state.error = null;
        } catch (err) {
          console.error('❌ Error loading products:', err);
          state.error = 'Failed to load products: ' + err.message;
          state.loading = false;
          render();
          return;
        }
        
        // Auto-select first product and load its teams
        if (state.products.length > 0) {
          state.selectedProduct = state.products[0].id;
          console.log('🟠 STEP 2: Auto-selected product:', state.selectedProduct);
          
          try {
            console.log('🔵 STEP 3: Fetching teams for product:', state.selectedProduct);
            state.teams = await apiService.getTeams(state.selectedProduct);
            console.log('✅ Teams loaded:', state.teams);
            
            // Auto-select first team and load its sprints
            if (state.teams.length > 0) {
              state.selectedTeam = state.teams[0].id;
              console.log('🟠 STEP 4: Auto-selected team:', state.selectedTeam);
              
              try {
                console.log('🔵 STEP 5: Fetching sprints for team:', state.selectedTeam);
                state.sprints = await apiService.getSprints(state.selectedTeam, state.selectedProduct);
                console.log('✅ Sprints loaded:', state.sprints);
                
                // Auto-select first sprint and load metrics
                if (state.sprints.length > 0) {
                  state.selectedSprint = state.sprints[0].id;
                  console.log('🟠 STEP 6: Auto-selected sprint:', state.selectedSprint);
                  
                  try {
                    console.log('🔵 STEP 7: Fetching metrics...');
                    const metricsArray = await apiService.getMetrics(state.selectedProduct, state.selectedTeam, state.selectedSprint);
                    console.log('✅ Metrics response:', metricsArray);
                    
                    if (Array.isArray(metricsArray) && metricsArray.length > 0) {
                      state.metrics = metricsArray[0];
                      console.log('🟢 STEP 8: SUCCESS! Metrics set:', state.metrics);
                    } else {
                      console.warn('⚠️ Metrics array is empty');
                      state.metrics = null;
                    }
                  } catch (err) {
                    console.error('❌ Error loading metrics:', err);
                    state.error = 'Failed to load metrics: ' + err.message;
                  }
                }
              } catch (err) {
                console.error('❌ Error loading sprints:', err);
                state.error = 'Failed to load sprints: ' + err.message;
              }
            }
          } catch (err) {
            console.error('❌ Error loading teams:', err);
            state.error = 'Failed to load teams: ' + err.message;
          }
        }
        
        state.loading = false;
        render();
      }

      async function handleProductChange(e) {
        state.selectedProduct = e.target.value;
        if (!state.selectedProduct) {
          state.teams = [];
          state.sprints = [];
          state.selectedTeam = '';
          state.selectedSprint = '';
          state.metrics = null;
          render();
          return;
        }

        try {
          state.loading = true;
          console.log('📦 Loading teams for product:', state.selectedProduct);
          state.teams = await apiService.getTeams(state.selectedProduct);
          console.log('✅ Teams loaded:', state.teams);
          state.selectedTeam = '';
          state.selectedSprint = '';
          state.sprints = [];
          state.metrics = null;
          state.error = null;
          
          // Auto-select first team and cascade
          if (state.teams.length > 0) {
            state.selectedTeam = state.teams[0].id;
            console.log('👉 Auto-selecting first team:', state.selectedTeam);
            
            // Check if the auto-selected team is CPOD (date-range mode)
            if (isCpodTeam()) {
              console.log('📅 CPOD team auto-selected — switching to date-range mode');
              const today = new Date().toISOString().slice(0, 10);
              state.cpodStartDate = today;
              state.cpodEndDate = today;
              state.sprints = [];
              state.selectedSprint = '';
              try {
                await loadMetricsAuto();
              } catch (err) {
                console.error('❌ Error loading CPOD metrics:', err);
                state.error = 'Failed to load CPOD metrics: ' + err.message;
              }
            } else {
              state.cpodStartDate = '';
              state.cpodEndDate = '';
              // Now load sprints for this team
              try {
                console.log('📦 Loading sprints for team:', state.selectedTeam);
                state.sprints = await apiService.getSprints(state.selectedTeam, state.selectedProduct);
                console.log('✅ Sprints loaded:', state.sprints);
              
                // Auto-select first sprint and load metrics
                if (state.sprints.length > 0) {
                  state.selectedSprint = state.sprints[0].id;
                  console.log('👉 Auto-selecting first sprint:', state.selectedSprint);
                
                  // Load metrics for this sprint
                  try {
                    console.log('📦 Loading metrics...');
                    const metricsArray = await apiService.getMetrics(state.selectedProduct, state.selectedTeam, state.selectedSprint);
                    console.log('✅ Metrics response:', metricsArray);
                  
                    if (Array.isArray(metricsArray) && metricsArray.length > 0) {
                      state.metrics = metricsArray[0];
                      console.log('🟢 SUCCESS! Metrics loaded:', state.metrics);
                    }
                  } catch (err) {
                    console.error('❌ Error loading metrics:', err);
                    state.error = 'Failed to load metrics: ' + err.message;
                  }
                }
              } catch (err) {
                console.error('❌ Error loading sprints:', err);
                state.error = 'Failed to load sprints: ' + err.message;
              }
            }
          }
        } catch (err) {
          console.error('❌ Error loading teams:', err);
          state.error = 'Failed to load teams: ' + err.message;
        } finally {
          state.loading = false;
        }
        render();
      }

      async function handleTeamChange(e) {
        state.selectedTeam = e.target.value;
        if (!state.selectedTeam) {
          state.sprints = [];
          state.selectedSprint = '';
          state.cpodStartDate = '';
          state.cpodEndDate = '';
          state.metrics = null;
          render();
          return;
        }

        try {
          state.loading = true;

          // CPOD team uses date-range mode instead of sprints
          if (isCpodTeam()) {
            console.log('📅 CPOD team selected — switching to date-range mode');
            state.sprints = [];
            state.selectedSprint = '';
            // Default to today's date for both start and end
            const today = new Date().toISOString().slice(0, 10);
            state.cpodStartDate = today;
            state.cpodEndDate = today;
            state.metrics = null;
            state.error = null;
            render();

            // Auto-load metrics for today
            try {
              console.log('📦 Loading CPOD metrics for date range:', state.cpodStartDate, '-', state.cpodEndDate);
              await loadMetricsAuto();
              console.log('✅ CPOD Metrics loaded:', state.metrics);
            } catch (err) {
              console.error('❌ Error loading CPOD metrics:', err);
              state.error = 'Failed to load CPOD metrics: ' + err.message;
            }
          } else {
            state.cpodStartDate = '';
            state.cpodEndDate = '';
            console.log('📦 Loading sprints for team:', state.selectedTeam);
            state.sprints = await apiService.getSprints(state.selectedTeam, state.selectedProduct);
            console.log('✅ Sprints loaded:', state.sprints);
            state.selectedSprint = '';
            state.metrics = null;
            state.error = null;
          
            // Auto-select first sprint and load metrics
            if (state.sprints.length > 0) {
              state.selectedSprint = state.sprints[0].id;
              console.log('👉 Auto-selecting first sprint:', state.selectedSprint);
              render();
            
              // Load metrics for this sprint
              try {
                console.log('📦 Loading metrics...');
                const metricsArray = await apiService.getMetrics(state.selectedProduct, state.selectedTeam, state.selectedSprint);
                console.log('✅ Metrics response:', metricsArray);
              
                if (Array.isArray(metricsArray) && metricsArray.length > 0) {
                  state.metrics = metricsArray[0];
                  console.log('🟢 SUCCESS! Metrics loaded:', state.metrics);
                }
              } catch (err) {
                console.error('❌ Error loading metrics:', err);
                state.error = 'Failed to load metrics: ' + err.message;
              }
            }
          }
        } catch (err) {
          console.error('❌ Error loading sprints:', err);
          state.error = 'Failed to load sprints: ' + err.message;
        } finally {
          state.loading = false;
        }
        render();
      }

      async function handleSprintChange(e) {
        state.selectedSprint = e.target.value;
        await loadMetrics(state.selectedProduct, state.selectedTeam, state.selectedSprint);
      }

      async function handleCpodDateChange() {
        if (!state.cpodStartDate || !state.cpodEndDate) return;
        if (state.cpodStartDate > state.cpodEndDate) {
          state.error = 'Start date must be before or equal to end date';
          state.metrics = null;
          render();
          return;
        }
        try {
          state.loading = true;
          state.error = null;
          render();
          console.log('📅 Loading CPOD metrics for:', state.cpodStartDate, 'to', state.cpodEndDate);
          await loadMetricsAuto();
        } catch (err) {
          console.error('❌ Error loading CPOD metrics:', err);
          state.error = 'Failed to load CPOD metrics: ' + err.message;
        } finally {
          state.loading = false;
        }
        render();
      }

      async function loadMetrics(product, team, sprint) {
        if (!product) {
          state.metrics = null;
          render();
          return;
        }

        try {
          state.loading = true;
          const metricsArray = await apiService.getMetrics(product, team, sprint);
          console.log('Metrics response:', metricsArray);
          
          // API returns an array, but we want a single metric object
          if (Array.isArray(metricsArray) && metricsArray.length > 0) {
            state.metrics = metricsArray[0];
            console.log('Selected first metric:', state.metrics);
          } else {
            state.metrics = null;
            console.log('No metrics found for:', { product, team, sprint });
          }
          
          state.error = null;
        } catch (err) {
          state.error = 'Failed to load metrics: ' + err.message;
          console.error('Error loading metrics:', err);
        } finally {
          state.loading = false;
        }
        render();
      }

      function render() {
        const app = document.getElementById('app');

        // Show DoR Compliance (TAD/TS) view if selected
        if (state.currentView === 'dorCompliance') {
          let html = `
            <div class="dashboard">
              <header class="dashboard-header" style="padding: 15px 20px; text-align: left;">
                <button class="back-btn" id="backBtn">← Back to Dashboard</button>
              </header>
              <div id="dorComplianceContainer"></div>
            </div>
          `;
          app.innerHTML = html;

          document.getElementById('backBtn').addEventListener('click', () => {
            state.currentView = 'dashboard';
            render();
          });

          loadDorComplianceView();
          return;
        }

        // Show Tests Covered view if selected
        if (state.currentView === 'testsCovered') {
          let html = `
            <div class="dashboard">
              <header class="dashboard-header" style="padding: 15px 20px; text-align: left;">
                <button class="back-btn" id="backBtn">← Back to Dashboard</button>
              </header>
              <div id="testsCoveredContainer"></div>
            </div>
          `;
          app.innerHTML = html;

          document.getElementById('backBtn').addEventListener('click', () => {
            state.currentView = 'dashboard';
            render();
          });

          loadTestsCoveredView();
          return;
        }

        // Show Defect Detail views
        if (state.currentView === 'openDefects' || state.currentView === 'closedDefects' || state.currentView === 'reopenedDefects') {
          const defectType = state.currentView;
          const titleMap = { openDefects: '🚨 Open Defects', closedDefects: '✓ Closed Defects', reopenedDefects: '↩️ Reopened Defects' };
          let html = `
            <div class="dashboard">
              <header class="dashboard-header" style="padding: 15px 20px; text-align: left;">
                <button class="back-btn" id="backBtn">← Back to Dashboard</button>
              </header>
              <div id="defectDetailContainer"></div>
            </div>
          `;
          app.innerHTML = html;

          document.getElementById('backBtn').addEventListener('click', () => {
            state.currentView = 'dashboard';
            render();
          });

          loadDefectDetailView(defectType);
          return;
        }

        // Show main dashboard view
        let html = `
          <div class="dashboard">
            <header class="dashboard-header">
              <div class="dashboard-header-inner">
