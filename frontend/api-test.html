<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>Frontend API Connectivity Test</h1>
    <div id="results"></div>
    
    <script>
        const API_BASE = 'http://localhost:3000';
        const resultsDiv = document.getElementById('results');
        
        async function test() {
            try {
                resultsDiv.innerHTML += '<p>Testing QTest API...</p>';
                const r1 = await fetch(`${API_BASE}/api/qtest/sprint/26.1.2`);
                const d1 = await r1.json();
                resultsDiv.innerHTML += `<p>✅ QTest API: Got ${d1.totals.total} tests</p>`;
                
                resultsDiv.innerHTML += '<p>Testing Defects API...</p>';
                const r2 = await fetch(`${API_BASE}/api/defects/by-module?sprint=26.1.2`);
                const d2 = await r2.json();
                resultsDiv.innerHTML += `<p>✅ Defects API: Got ${d2.totals.open} open defects</p>`;
                
                resultsDiv.innerHTML += '<p style="color: green;"><strong>✅ Both APIs accessible from frontend!</strong></p>';
            } catch (err) {
                resultsDiv.innerHTML += `<p style="color: red;">❌ Error: ${err.message}</p>`;
            }
        }
        
        window.addEventListener('DOMContentLoaded', test);
    </script>
</body>
</html>
